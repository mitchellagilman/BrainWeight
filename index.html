const demoCoach=()=>({headline:'Strength and mobility coach for busy lifters',about:'Sample coach for the preview.\n\nI help lifters get strong without living in the gym: 3–4 focused sessions a week, smart progressions, and mobility that actually fixes things. Every client gets a program built around their schedule and weekly check-ins.',specialties:['Strength','Mobility','Busy schedules'],achievements:['Coached 120+ lifters to new PRs','Former D1 strength intern','Ran a 4-person powerlifting team to state'],certifications:['NSCA-CSCS','Precision Nutrition L1'],years_exp:8,photos:[],price_cents:14900,accepting:true,max_clients:30});
const demoMyCoach=()=>({headline:'',about:'',specialties:[],achievements:[],certifications:[],years_exp:null,photos:[],price_cents:9900,accepting:false,max_clients:30});
/* Browse coaches, book monthly coaching (paid through Stripe, coach gets 90%),
   coach portal (profile, photos, clients, programs, payouts), applications. */
const money=c=>'$'+(c/100).toFixed(c%100?2:0);
const isCoachMe=()=>!!(ME.profile&&(ME.profile.is_coach||ME.profile.is_admin));
const COACH_STATUS={active:'Active',past_due:'Payment issue',canceled:'Ended',pending:'Not paid yet'};
let MARKET=null;

/* ---------- marketplace ---------- */
function coachCardHTML(c){
  const img=c.photo?`<img class="cc-photo" src="${esc(c.photo)}" alt="" loading="lazy">`:`<div class="cc-photo cc-ph">${avatarHTML(c,72)}</div>`;
  const avail=!c.ready?'<span class="badge">Not booking yet</span>':c.full_up?'<span class="badge">Full</span>':c.accepting?'<span class="badge teal">Taking clients</span>':'<span class="badge">Waitlist</span>';
  return `<button class="card coach-tile" data-coach="${esc(c.id)}">${img}
    <div class="cc-main"><div class="cc-top"><b>${nameOf(c)}</b>${c.id===ME.user?.id?'<span class="badge">You</span>':''}</div>
      <span class="cc-head">${esc(c.headline||'Strength coach')}</span>
      ${c.specialties&&c.specialties.length?`<div class="cc-tags">${c.specialties.slice(0,3).map(s=>`<span>${esc(s)}</span>`).join('')}</div>`:''}
      <div class="cc-foot"><span class="cc-price"><b>${money(c.price_cents)}</b>/month</span>${avail}</div>
      ${c.my_status==='active'||c.my_status==='past_due'?'<span class="cc-mine">Your coach</span>':''}</div></button>`;
}
async function openCoaches(){
  const o=sheet(`<div class="sheet-h"><h2>Coaches</h2><button class="link" data-close>Done</button></div>
    <p class="muted" style="font-size:14px;margin:0">1:1 coaching with a real coach. They build your program, check in, and answer your questions. Billed monthly, cancel anytime.</p>
    <div id="mkList" class="stack"><div class="spinner"></div></div>
    <div id="mkApply"></div>`,{full:true});
  o.querySelector('.sheet').style.overflowY='auto';
  const list=o.querySelector('#mkList');
  try{MARKET=await API.coachMarket();
    list.innerHTML=MARKET.length?MARKET.map(coachCardHTML).join(''):'<p class="empty">No coaches yet.</p>';
  }catch(e){list.innerHTML=`<p class="empty">${esc(errMsg(e))}</p>`}
  list.addEventListener('click',e=>{const b=e.target.closest('[data-coach]');if(b){openCoachDetail(b.dataset.coach)}});
  if(!isCoachMe())o.querySelector('#mkApply').innerHTML=`<div class="card apply-cta"><b>Are you a coach?</b><span class="muted" style="font-size:14px">Apply to coach on Brainweight. Set your own monthly price and keep 90%.</span><button class="secondary" data-act="coach-apply">Apply to coach</button></div>`;
  else o.querySelector('#mkApply').innerHTML=`<button class="secondary" data-act="coach-portal">Open my Coach portal</button>`;
}
async function openCoachDetail(id){
  if(id===undefined)return;
  const o=sheet(`<div class="sheet-h"><button class="link" data-close>‹ Back</button><span></span><span style="width:52px"></span></div><div id="cdBox"><div class="spinner"></div></div>`,{full:true});
  o.querySelector('.sheet').style.overflowY='auto';
  const box=o.querySelector('#cdBox');
  let c;try{c=await API.coachDetail(id)}catch(e){box.innerHTML=`<p class="empty">${esc(errMsg(e))}</p>`;return}
  if(!c){box.innerHTML='<p class="empty">This coach isn’t available.</p>';return}
  const me=c.id===ME.user?.id,mine=c.mine&&['active','past_due'].includes(c.mine.status)?c.mine:null;
  const photos=(c.photos||[]).length?c.photos:[];
  const canBook=!me&&!mine&&c.ready&&c.accepting&&!c.full_up;
  const why=me?'':mine?'':!c.ready?'This coach is still setting up payments.':c.full_up?'This coach is full right now.':!c.accepting?'This coach isn’t taking new clients right now.':'';
  const list=(t,arr)=>arr&&arr.length?`<div class="card"><span class="eyebrow">${t}</span><ul class="cues">${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:'';
  box.innerHTML=`<div class="stack">
    ${photos.length?`<div class="cd-gallery">${photos.map(p=>`<img src="${esc(p)}" alt="${esc(nameOf(c))}" loading="lazy">`).join('')}</div>${photos.length>1?`<p class="muted" style="font-size:12px;text-align:center;margin:-6px 0 0">Swipe for more photos</p>`:''}`:''}
    <div class="cd-head">${avatarHTML(c,64)}<div><h2>${nameOf(c)} ${coachTag(c)}</h2><span class="muted">@${esc(c.username)}</span></div></div>
    ${c.headline?`<p class="cd-headline">${esc(c.headline)}</p>`:''}
    <div class="tiles"><div class="tile"><b>${money(c.price_cents)}</b><span>per month</span></div><div class="tile"><b>${c.years_exp!=null?c.years_exp+' yr':'—'}</b><span>Coaching</span></div><div class="tile"><b>${c.clients}</b><span>Clients now</span></div></div>
    ${mine?`<div class="card mine-card"><b>${mine.status==='active'?'You’re coached by '+esc(nameOf(c)):'There’s a problem with your payment'}</b><span class="muted" style="font-size:14px">${mine.cancel_at_period_end?'Ends':'Renews'} ${mine.current_period_end?new Date(mine.current_period_end).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'soon'}</span><button class="secondary" data-act="my-coaching">Open my coaching</button></div>`:''}
    ${canBook?`<button class="primary" id="cdBook">Book coaching · ${money(c.price_cents)}/month</button><p class="muted" style="font-size:12px;margin:-4px 0 0;text-align:center">Billed monthly. Cancel anytime.</p>`:why?`<p class="muted" style="font-size:14px;text-align:center">${why}</p>`:''}
    ${me?'':`<div style="display:flex;gap:8px"><button class="secondary" id="cdMsg" style="flex:1">Message</button><button class="secondary" id="cdFol" style="flex:1">${c.i_follow?'Following':'Follow'}</button><button class="secondary" id="cdPosts">Posts</button></div>`}
    ${me?'<button class="secondary" data-act="coach-portal">Edit in Coach portal</button>':''}
    ${c.specialties&&c.specialties.length?`<div class="cc-tags big">${c.specialties.map(s=>`<span>${esc(s)}</span>`).join('')}</div>`:''}
    ${c.about?`<div class="card"><span class="eyebrow">About</span><p class="cd-about">${esc(c.about)}</p></div>`:c.bio?`<div class="card"><span class="eyebrow">About</span><p class="cd-about">${esc(c.bio)}</p></div>`:''}
    ${list('Achievements',c.achievements)}
    ${list('Certifications',c.certifications)}
    <div class="card"><span class="eyebrow">How coaching works</span><ul class="cues"><li>Answer a few questions about your goals when you book.</li><li>Your coach builds programs for you right in the app.</li><li>Message your coach anytime.</li><li>Billed monthly. Cancel anytime, and you keep coaching until the end of the month you paid for.</li></ul></div>
  </div>`;
  const bk=box.querySelector('#cdBook');if(bk)bk.onclick=()=>openBookCoach(c);
  const ms=box.querySelector('#cdMsg');if(ms)ms.onclick=()=>{o.close();messageUser(c)};
  const fo=box.querySelector('#cdFol');if(fo)fo.onclick=async()=>{fo.disabled=true;try{await API.follow(c.id,!c.i_follow);c.i_follow=!c.i_follow;fo.textContent=c.i_follow?'Following':'Follow'}catch(e){toast(errMsg(e))}fo.disabled=false};
  const ps=box.querySelector('#cdPosts');if(ps)ps.onclick=()=>{o.close();openProfile(c.id)};
}
function openBookCoach(c){
  const st={goal:'',exp:'mid',days:'4',injuries:'',notes:''};
  const o=sheet(`<div class="sheet-h"><button class="link" data-close>Cancel</button><h2>Book coaching</h2><span style="width:52px"></span></div>
    <div class="cd-head">${avatarHTML(c,44)}<div><b>${nameOf(c)}</b><br><span class="muted" style="font-size:14px">${money(c.price_cents)} per month</span></div></div>
    <p class="muted" style="font-size:14px;margin:0">Tell ${esc(nameOf(c).split(' ')[0])} about you. Only your coach sees these answers.</p>
    <div class="field"><label for="bkGoal">What’s your main goal?</label><textarea class="textarea" id="bkGoal" maxlength="600" placeholder="e.g. Bench 315 by summer, or lose 15 lb and get stronger" style="min-height:80px"></textarea></div>
    <div class="field"><label>How long have you been lifting?</label><div class="chips wrap" id="bkExp">${[['new','Under 6 months'],['mid','6 months to 2 years'],['adv','2+ years']].map(([v,l])=>`<button class="chip" data-v="${v}" aria-pressed="${v===st.exp}">${l}</button>`).join('')}</div></div>
    <div class="field"><label>Days per week you can train</label><div class="chips" id="bkDays">${['2','3','4','5','6'].map(v=>`<button class="chip" data-v="${v}" aria-pressed="${v===st.days}">${v}</button>`).join('')}</div></div>
    <div class="field"><label for="bkInj">Injuries or limits (optional)</label><textarea class="textarea" id="bkInj" maxlength="600" placeholder="e.g. Old shoulder injury, avoid overhead pressing" style="min-height:60px"></textarea></div>
    <div class="field"><label for="bkNotes">Anything else? (optional)</label><textarea class="textarea" id="bkNotes" maxlength="800" placeholder="Equipment, schedule, what you’ve tried before" style="min-height:60px"></textarea></div>
    <p class="g-err" id="bkErr"></p>
    <button class="primary" id="bkGo">Continue to payment</button>
    <p class="muted" style="font-size:12px;margin:0;text-align:center">${money(c.price_cents)} billed today, then monthly. Cancel anytime. By booking you agree to the <a href="terms.html" target="_blank" rel="noopener">Terms</a>.</p>`,{full:true});
  o.querySelector('.sheet').style.overflowY='auto';
  const pick=(id,key)=>o.querySelector(id).addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;st[key]=b.dataset.v;o.querySelectorAll(id+' [data-v]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
  pick('#bkExp','exp');pick('#bkDays','days');
  o.querySelector('#bkGo').onclick=async()=>{
    const goal=o.querySelector('#bkGoal').value.trim();const err=o.querySelector('#bkErr');
    if(goal.length<3){err.textContent='Add your main goal so your coach knows where to start.';return}
    const intake={goal,experience:{new:'Under 6 months',mid:'6 months to 2 years',adv:'2+ years'}[st.exp],days_per_week:+st.days,injuries:o.querySelector('#bkInj').value.trim(),notes:o.querySelector('#bkNotes').value.trim()};
    const b=o.querySelector('#bkGo');b.disabled=true;b.textContent='Opening secure checkout…';err.textContent='';
    try{const id=await API.requestCoaching(c.id,intake);const url=await API.coachCheckout(id);if(url){location.href=url;return}
      o.close();toast('Preview: coaching booked. No payment was taken.');openMyCoaching()}
    catch(e){err.textContent=errMsg(e);b.disabled=false;b.textContent='Continue to payment'}
  };
}

let MYCOACH=null;
async function loadMyCoaching(){try{MYCOACH=await API.myCoaching()}catch(e){MYCOACH=[]}return MYCOACH}
function myCoachingCardHTML(){
  if(!MYCOACH||!MYCOACH.length)return `<button class="card coach-cta" data-act="coaches"><span class="eyebrow">1:1 coaching</span><h3>Work with a coach</h3><span class="muted" style="font-size:14px">Get a program built for you and someone to keep you on track.</span><span class="plan-go">Browse coaches →</span></button>`;
  const k=MYCOACH[0];
  return `<button class="card coach-cta mine-card" data-act="my-coaching"><span class="eyebrow">My coach</span><div class="cd-head">${avatarHTML(k,44)}<div><b>${nameOf(k)}</b><br><span class="muted" style="font-size:13px">${esc(COACH_STATUS[k.status]||k.status)}${k.cancel_at_period_end&&k.status!=='canceled'?' · ending soon':''}</span></div></div><span class="plan-go">Programs and messages →</span></button>`;
}
async function openMyCoaching(){
  const o=sheet(`<div class="sheet-h"><h2>My coaching</h2><button class="link" data-close>Done</button></div><div id="mcBox"><div class="spinner"></div></div>`,{full:true});
  o.querySelector('.sheet').style.overflowY='auto';
  const box=o.querySelector('#mcBox');
  const paint=async()=>{
    const [ks,progs]=await Promise.all([loadMyCoaching(),API.clientPrograms().catch(()=>[])]);
    if(!ks.length){box.innerHTML=`<p class="empty">You’re not working with a coach yet.</p><button class="primary" data-act="coaches">Browse coaches</button>`;return}
    box.innerHTML=`<div class="stack">${ks.map(k=>{
      const pr=progs.filter(p=>p.coach_id===k.coach_id);
      const when=k.current_period_end?new Date(k.current_period_end).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'';
      return `<div class="card"><div class="cd-head">${avatarHTML(k,48)}<div><b>${nameOf(k)}</b> ${coachTag(k)}<br><span class="muted" style="font-size:13px">${esc(k.headline||'')}</span></div></div>
        <div class="tiles"><div class="tile"><b>${esc(COACH_STATUS[k.status]||k.status)}</b><span>Status</span></div><div class="tile"><b>${money(k.price_cents)}</b><span>per month</span></div><div class="tile"><b>${when||'—'}</b><span>${k.cancel_at_period_end||k.status==='canceled'?'Ends':'Renews'}</span></div></div>
        ${k.status==='past_due'?'<p class="g-err" style="text-align:left">Your last payment didn’t go through. Update your card in Profile → settings → Manage subscription.</p>':''}
        <div style="display:flex;gap:8px"><button class="primary" data-msgcoach="${esc(k.coach_id)}" style="flex:1">Message coach</button><button class="secondary" data-viewcoach="${esc(k.coach_id)}">Profile</button></div>
        <span class="eyebrow">Programs from your coach</span>
        ${pr.length?pr.map(p=>`<div class="cprog"><div><b>${esc(p.title)}</b><span class="muted" style="font-size:13px">${p.weeks?p.weeks+' weeks · ':''}${(p.days||[]).length} workouts</span></div><button class="chip" data-openprog="${esc(p.id)}">Open</button></div>`).join(''):'<p class="muted" style="font-size:14px;margin:0">Your coach hasn’t sent a program yet. You’ll get a notification when they do.</p>'}
        ${k.status!=='canceled'&&!k.cancel_at_period_end?`<button class="link danger" data-endcoach="${esc(k.id)}" style="align-self:flex-start">Cancel coaching</button>`:''}
      </div>`}).join('')}</div>`;
    box.querySelectorAll('[data-msgcoach]').forEach(b=>b.onclick=()=>{const k=ks.find(x=>x.coach_id===b.dataset.msgcoach);o.close();messageUser({id:k.coach_id,username:k.username,display_name:k.display_name,avatar_url:k.avatar_url,is_admin:k.is_admin,is_coach:k.is_coach})});
    box.querySelectorAll('[data-viewcoach]').forEach(b=>b.onclick=()=>openCoachDetail(b.dataset.viewcoach));
    box.querySelectorAll('[data-openprog]').forEach(b=>b.onclick=()=>openCoachProgramView(progs.find(p=>p.id===b.dataset.openprog)));
    box.querySelectorAll('[data-endcoach]').forEach(b=>confirmBtn(b,'Tap again to cancel at the end of this month',async()=>{try{await API.coachCancel(b.dataset.endcoach);toast('Coaching will end at the end of this month');paint()}catch(e){toast(errMsg(e))}}));
  };
  paint();
}
function openCoachProgramView(p){
  if(!p)return;
  const o=sheet(`<div class="sheet-h"><button class="link" data-close>‹ Back</button><span></span><span style="width:52px"></span></div>
    <span class="eyebrow">From your coach</span><h2>${esc(p.title)}</h2>${p.weeks?`<span class="badge teal">${p.weeks} weeks</span>`:''}
    ${p.description?`<div class="card"><p class="cd-about">${esc(p.description)}</p></div>`:''}
    ${(p.days||[]).map((d,i)=>planDayHTML(d,i).replace(/<\/div>$/,`<div style="display:flex;gap:8px"><button class="primary" data-start="${i}" style="flex:1">Start</button><button class="secondary" data-save="${i}">Save</button></div></div>`)).join('')}
    ${(p.days||[]).length?'<button class="secondary" id="cpAll">Save all workouts to my routines</button>':'<p class="muted">No workouts in this program yet.</p>'}`,{full:true});
  o.querySelector('.sheet').style.overflowY='auto';
  const saveDay=d=>putItem('routines',{id:'r-'+newId(),name:`${p.title} · ${d.name}`,exercises:clone(d.exercises||[])});
  o.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{const d=p.days[+b.dataset.start];if(ST.active){toast('Finish or discard your current workout first.');return}o.close();document.querySelectorAll('.sheet-ov').forEach(x=>x.remove());startWorkout({name:`${p.title} · ${d.name}`,exercises:clone(d.exercises||[])})});
  o.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{saveDay(p.days[+b.dataset.save]);toast('Saved to your routines')});
  const all=o.querySelector('#cpAll');if(all)all.onclick=()=>{p.days.forEach(saveDay);toast('All workouts saved to your routines')};
}

/* ---------- applying to coach ---------- */
async function openCoachApply(){
  const o=sheet(`<div class="sheet-h"><button class="link" data-close>Cancel</button><h2>Apply to coach</h2><span style="width:52px"></span></div><div id="apBox"><div class="spinner"></div></div>`,{full:true});
  o.querySelector('.sheet').style.overflowY='auto';
  const box=o.querySelector('#apBox');
  let app=null;try{app=await API.myApplication()}catch(e){}
  if(app&&app.status==='pending'){box.innerHTML=`<div class="card"><h3>Application received</h3><p class="muted" style="font-size:14px">We’re reviewing your application. You’ll get a notification when there’s an answer.</p></div>`;return}
  box.innerHTML=`<div class="stack">
    ${app&&app.status==='declined'?'<p class="muted" style="font-size:14px">Your last application wasn’t approved. You’re welcome to apply again.</p>':''}
    <section class="hero"><span class="eyebrow">Coach on Brainweight</span><h2>Get paid to coach.</h2>
      <p class="muted" style="font-size:14px">Set your own monthly price. Clients pay in the app and you keep 90%, paid out to your bank by Stripe. Build programs for clients and message them right here.</p></section>
    <div class="field"><label for="apYears">Years coaching</label><input class="input" id="apYears" inputmode="numeric" maxlength="2" placeholder="5"></div>
    <div class="field"><label for="apCerts">Certifications (separate with commas)</label><input class="input" id="apCerts" maxlength="1000" placeholder="NASM-CPT, CSCS"></div>
    <div class="field"><label for="apSpec">What you specialize in (separate with commas)</label><input class="input" id="apSpec" maxlength="300" placeholder="Powerlifting, Hypertrophy, Beginners"></div>
    <div class="field"><label for="apAbout">About you and how you coach</label><textarea class="textarea" id="apAbout" maxlength="3000" style="min-height:120px" placeholder="Your background, results you’ve helped clients get, and what working with you looks like."></textarea></div>
    <div class="field"><label for="apLinks">Instagram or website (optional)</label><input class="input" id="apLinks" maxlength="500" placeholder="@yourhandle"></div>
    <label class="terms-agree"><input type="checkbox" id="apOk"><span>The information above is true. I’m an independent coach responsible for the advice I give, and I agree to the <a href="terms.html" target="_blank" rel="noopener">Terms</a>, including Brainweight’s 10% fee on coaching payments.</span></label>
    <p class="g-err" id="apErr"></p>
    <button class="primary" id="apGo">Submit application</button></div>`;
  box.querySelector('#apGo').onclick=async()=>{
    const err=box.querySelector('#apErr'),about=box.querySelector('#apAbout').value.trim(),yrs=parseInt(box.querySelector('#apYears').value,10);
    if(!box.querySelector('#apOk').checked){err.textContent='Please confirm the statement above.';return}
    if(about.length<40){err.textContent='Tell us a bit more about how you coach (at least a couple of sentences).';return}
    const b=box.querySelector('#apGo');b.disabled=true;
    try{await API.applyCoach({years_exp:isNaN(yrs)?null:Math.max(0,Math.min(60,yrs)),certifications:box.querySelector('#apCerts').value.trim(),specialties:box.querySelector('#apSpec').value.trim(),about,links:box.querySelector('#apLinks').value.trim()});
      box.innerHTML=`<div class="card"><h3>Application sent</h3><p class="muted" style="font-size:14px">Thank you. We’ll review it and send you a notification when there’s an answer.</p></div>`}
    catch(e){err.textContent=errMsg(e);b.disabled=false}
  };
}

  if(!isCoachMe()){openCoachApply();return}
  const o=sheet(`<div class="sheet-h"><h2>Coach portal</h2><button class="link" data-close>Done</button></div>
    <div class="seg wide admin-seg" id="cpSeg">${[['overview','Overview'],['profile','Profile'],['clients','Clients'],['programs','Programs'],['payouts','Payouts']].map(([k,l])=>`<button data-t="${k}">${l}</button>`).join('')}</div>
    <div id="cpBox"><div class="spinner"></div></div>`,{full:true});
  o.querySelector('.sheet').style.overflowY='auto';
  const box=o.querySelector('#cpBox'),seg=o.querySelector('#cpSeg');
  try{await API.ensureCoachProfile()}catch(e){}
  const go=t=>{tab=t;seg.querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===t)));box.innerHTML='<div class="spinner"></div>';

async function cpOverview(box,go){
  const [cp,pay,clients]=await Promise.all([API.myCoachProfile(),API.coachStatus().catch(()=>({})),API.myClients().catch(()=>[])]);
  const act=clients.filter(c=>c.status==='active'||c.status==='past_due');
  const monthly=act.reduce((s,c)=>s+c.price_cents,0);
  const checks=[[!!cp.headline,'Add a headline','profile'],[(cp.photos||[]).length>0,'Add at least one photo','profile'],[(cp.about||'').length>=80,'Write your About section','profile'],[!!pay.charges_enabled,'Set up payouts with Stripe','payouts'],[!!cp.accepting,'Turn on “Taking new clients”','profile']];
  const left=checks.filter(c=>!c[0]);
  box.innerHTML=`<div class="stack">
    <div class="tiles"><div class="tile"><b>${act.length}</b><span>Active clients</span></div><div class="tile"><b>${money(Math.round(monthly*.9))}</b><span>Your monthly take</span></div><div class="tile"><b>${money(cp.price_cents)}</b><span>Your price</span></div></div>
    <p class="muted" style="font-size:12px;margin:0">Your take is after Brainweight’s 10%. Stripe’s card processing fee also comes out of each payment.</p>
    ${left.length?`<div class="card"><span class="eyebrow">Get ready to book clients</span>${checks.map(([ok,l,t])=>`<button class="check-row" data-go="${t}"><i class="${ok?'on':''}">${ok?'✓':''}</i><span>${l}</span>${ok?'':'<b>→</b>'}</button>`).join('')}</div>`
      :`<div class="card"><b>You’re live in the Coaches section.</b><span class="muted" style="font-size:14px">Clients can find and book you now.</span></div>`}
    <button class="secondary" id="ovPrev">See your public profile</button>
    <div class="card"><span class="eyebrow">Recent clients</span>${act.length?act.slice(0,5).map(c=>`<div class="cprog"><div class="cd-head">${avatarHTML(c,36)}<div><b>${nameOf(c)}</b><br><span class="muted" style="font-size:12px">${esc(COACH_STATUS[c.status])}</span></div></div></div>`).join(''):'<p class="muted" style="font-size:14px;margin:0">No clients yet.</p>'}</div></div>`;
  box.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  box.querySelector('#ovPrev').onclick=()=>openCoachDetail(ME.user.id);
}

  o.querySelector('#chWho').onclick=()=>{o.close();openProfile(other.id)};
  const close0=o.close;o.close=()=>{closed=true;clearInterval(timer);close0();if(onBack)onBack();refreshBadges(true)};
}

    ${src?'<button class="secondary danger" id="peDel">Delete program</button>':''}<p class="g-err" id="peErr"></p>`;

/* ---------- account, plan and admin ---------- */
function planLine(){
  const a=ME.access||{},s=a.subscription,g=a.grant,d=x=>new Date(x).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
  if(a.admin&&API.live)return{title:'Owner',line:'Full access to everything'};
  if(s&&['active','trialing','past_due'].includes(s.status)){
    const name=s.plan==='pro'?'Pro':'Member';
    if(s.status==='trialing')return{title:name,line:`Free trial until ${d(s.trial_end||s.current_period_end)}`};
    if(s.status==='past_due')return{title:name,line:'Payment failed. Update your card in Manage subscription.'};
    return{title:name,line:s.cancel_at_period_end?`Ends ${d(s.current_period_end)}`:`Renews ${d(s.current_period_end)}`};
  }
  if(g)return{title:g.plan==='pro'?'Pro':'Member',line:`${g.source.startsWith('promo:')?'Promo code':'Gift from '+COACH} · ${g.expires_at?'free until '+d(g.expires_at):'free forever'}`};
  return{title:'No plan',line:''};
}

        <div style="display:flex;gap:8px;flex-wrap:wrap">${r.post&&!r.post.hidden?`<button class="secondary" data-hide="${esc(r.post.id)}" data-r="${esc(r.id)}">Hide post</button><button class="secondary danger" data-del="${esc(r.post.id)}" data-r="${esc(r.id)}">Delete post</button>`:''}<button class="secondary" data-ok="${esc(r.id)}">Dismiss</button></div></div>`).join('')}</div>`:'<p class="empty">No open reports. 🎉</p>';
      box.querySelectorAll('[data-hide]').forEach(b=>b.onclick=async()=>{try{await API.hidePost(b.dataset.hide);await API.resolveReport(b.dataset.r);removePost(b.dataset.hide);paint()}catch(e){toast(errMsg(e))}});
      box.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{try{await API.deletePost(b.dataset.del);await API.resolveReport(b.dataset.r).catch(()=>{});removePost(b.dataset.del);paint()}catch(e){toast(errMsg(e))}});
      box.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{try{await API.resolveReport(b.dataset.ok);paint()}catch(e){toast(errMsg(e))}});
    };
    paint();
  }
}
function viewImage(src){const v=el(`<div class="ov viewer" role="dialog" aria-label="Photo"><img src="${esc(src)}" alt=""><button aria-label="Close">✕</button></div>`);v.onclick=()=>v.remove();document.body.appendChild(v)}

/* ---------- social clicks ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const id=b.dataset.id;
  switch(b.dataset.act){
    case'feed-mode':FEED.mode=b.dataset.mode;document.querySelectorAll('[data-act="feed-mode"]').forEach(c=>c.setAttribute('aria-pressed',c===b));loadFeed(true);break;
    case'feed-refresh':loadFeed(true);break;
    case'feed-more':b.disabled=true;loadFeed(false);break;
    case'compose':openComposer();break;
    case'like':toggleLike(id);break;
    case'open-post':openPost(id);break;
    case'post-menu':openPostMenu(id);break;
    case'open-profile':openProfile(id);break;
    case'people-search':openPeopleSearch();break;
    case'inbox':openInbox();break;
    case'coaches':openCoaches();break;
    case'coach':openCoachDetail(id);break;
    case'coach-apply':document.querySelectorAll('.sheet-ov').forEach(o=>o.remove());openCoachApply();break;
    case'coach-portal':document.querySelectorAll('.sheet-ov').forEach(o=>o.remove());openCoachPortal();break;
    case'my-coaching':document.querySelectorAll('.sheet-ov').forEach(o=>o.remove());openMyCoaching();break;
    case'post-save-workout':savePostWorkout(id);break;
    case'view-img':viewImage(b.dataset.src);break;
    case'prog-lift':PROG_LIFT=id;softRender();break;
    case'prog-game':PROG_GAME=id;softRender();break;
    case'leaderboard':openLeaderboard(b.dataset.game);break;
    case'pr-share':openPRShare([recentPRs(8)[+b.dataset.i]].filter(Boolean));break;
    case'pr-share-w':{const w=ST.workouts.find(x=>x.id===id);if(w)openPRShare((w.prs||[]).map(p=>Object.assign(parsePR(p),{t:w.start})));break}
    case'notif-ask':LS.set('pushAsked',true);document.querySelectorAll('.sheet-ov').forEach(o=>o.remove());openNotifications();break;
    case'tools':openTools(b.dataset.tool||'plates');break;
    case'invite':openInvite();break;
    case'prof-sub':PROFILE_SUB=b.dataset.sub;LS.set('profileSub',PROFILE_SUB);softRender();if(PROFILE_SUB==='posts')loadMine();break;
    case'edit-profile':openEditProfile();break;
    case'open-program':openProgram(id);break;
    case'new-program':openProgramEditor(b.dataset.premium?{title:'',summary:'',body:'',level:'Intermediate',goal:'',days_per_week:3,weeks:8,premium:true,published:true,routines:[],cover_url:null,sort:100}:null);break;
    case'prog-refresh':PROG.list=null;softRender();loadPrograms();break;
    case'upgrade':upgrade('pro');break;
    case'share-workout':{const w=ST.workouts.find(x=>x.id===id);document.querySelectorAll('.sheet-ov').forEach(o=>o.remove());if(w)openComposer({attachment:workoutAttachment(w)});break}
    case'share-lift':{const a=liftAttachment(id);document.querySelectorAll('.sheet-ov').forEach(o=>o.remove());if(a)openComposer({attachment:a});else toast('Log this exercise first.');break}
  }
});

/* ================= events ================= */
document.addEventListener('click',e=>{
  const g=e.target.closest('#gChips [data-game]');if(g){mountGame(g.dataset.game);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const A=ST.active,i=+b.dataset.i,j=+b.dataset.j;
  switch(b.dataset.act){
    case'tab':setTab(b.dataset.tab);break;
    case'settings':openSettings();break;
    case'start-empty':startWorkout(null);break;
    case'start-routine':{const r=ST.routines.find(x=>x.id===b.dataset.id)||TEMPLATES.find(x=>x.id===b.dataset.id);if(r)startWorkout(r);break}
    case'new-routine':openNewRoutineChoice();break;
    case'plan-build':openPlanBuilder();break;
    case'plan-view':openPlanView();break;
    case'plan-start':planStart(+b.dataset.i);break;
    case'plan-next':{const p=myPlan();if(p)openPlanBuilder(nextBlockAnswers(p));break}
    case'edit-routine':{const r=ST.routines.find(x=>x.id===b.dataset.id)||TEMPLATES.find(x=>x.id===b.dataset.id);if(r)openRoutineEditor(r);break}
    case'add-ex':openPicker({onDone:ids=>{ids.forEach(id=>A.exercises.push(newEx(id)));saveActive();render();const last=document.querySelectorAll('.ex');last[last.length-1]&&last[last.length-1].scrollIntoView({block:'start'})}});break;
    case'ex-menu':openExMenu(i);break;
    case'ex-open':openExercise(b.dataset.id);break;
    case'set-menu':openSetMenu(i,j);break;
    case'use-prev':{const x=A.exercises[i],p=prevFor(x.exId,j);if(!p||x.sets[j].done)break;(TYPES[x.type]||TYPES.w).forEach(f=>x.sets[j][f]=p[f]??null);saveActive();render();break}
    case'check':{const s=A.exercises[i].sets[j];if(s.done){s.done=false;saveActive();render();break}
      if(completeSet(i,j)){render()}else{pulse(document.querySelector(`[data-row="${i}-${j}"]`),'shake');toast('Enter your numbers first')}break}
    case'add-set':{const x=A.exercises[i],last=x.sets[x.sets.length-1];x.sets.push(newSet(last?{kind:last.kind==='w'?'n':last.kind,w:last.w,r:last.r,t:last.t,d:last.d}:null));saveActive();render();break}
    case'finish':finishWorkout();break;
    case'wk-menu':openWkMenu();break;
    case'rest-minus':if(resting()){A.restEnd-=15000;saveActive();tick();N('restStart',A.restEnd,restLabel())}break;
    case'rest-plus':if(resting()){A.restEnd+=15000;A.restTotal=Math.max(A.restTotal,A.restEnd-Date.now());warned=false;saveActive();tick();N('restStart',A.restEnd,restLabel())}break;
    case'rest-skip':N('restCancel');A.restEnd=0;A.restOver=false;restFired=true;saveActive();renderDock();syncPause();updateLock();break;
    case'rest-dismiss':A.restOver=false;saveActive();renderDock();break;
    case'play':openGame();break;
    case'game-close':{const wasFree=G.free;closeGame();if(wasFree){softRender();break}if(ST.tab!=='workout')setTab('workout');const ns=nextSet();if(ns&&A&&A.restOver)goToRow(ns.i,ns.j);break}
    case'free-play':openGame(true,b.dataset.game);break;
    case'daily':openDaily();break;
    case'hide-install':LS.set('hideInstall',true);render();break;
    case'install':if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.finally(()=>{deferredInstall=null;render()})}break;
    case'new-custom':openCustom();break;
    case'hist-open':openHistory(b.dataset.id);break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target,A=ST.active;
  if(t.id==='wkName'&&A){A.name=t.value;saveActive();return}
  if(t.dataset.note!=null&&A){A.exercises[+t.dataset.note].note=t.value;saveActive();return}
  if(t.classList.contains('fin')&&A){const s=A.exercises[+t.dataset.i].sets[+t.dataset.j];s[t.dataset.f]=fieldParse(t.dataset.f,t.value);saveActive()}
});
document.addEventListener('focusout',e=>{
  const t=e.target;if(!t.classList||!t.classList.contains('fin')||!ST.active)return;
  const s=ST.active.exercises[+t.dataset.i]?.sets[+t.dataset.j];if(s)t.value=fieldDisp(t.dataset.f,s[t.dataset.f]);
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('fin'))e.target.blur()});
new MutationObserver(()=>{const q=document.getElementById('xQ');if(q&&!q.dataset.w){q.dataset.w='1';wireFilters($('#main'),exFilter,'x',renderExList)}}).observe($('#main'),{childList:true});

if(ST.active){
  ST.active.restAfter=ST.active.restAfter||null;
  if(ST.active.restEnd&&ST.active.restEnd<=Date.now()){ST.active.restEnd=0}

}
