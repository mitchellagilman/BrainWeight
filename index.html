/* Layout: one-screen phone app. Brand bar, scrolling tab body, glass dock (rest timer, active workout, tabs). Two-sided identity: cyan = mind (rest, games), orange = body (lifting). Dark-only by design. */
:root{
  --bg:#06080C; --surface:#0F131A; --surface-2:#19202A; --glass:rgba(15,19,26,.82); --fg:#EEF3F8; --muted:#8693A4; --line:#212935;
  --mind:#34E3C8; --mind-dim:rgba(52,227,200,.14); --body:#2F86FF; --body-dim:rgba(47,134,255,.14);
  --accent:#3FD8FF; --good:#34DD8A; --good-tint:rgba(52,221,138,.12); --bad:#FF4D5E;
  --p25:#FF4D5E; --p20:#3A7BFF; --p15:#FFC02E; --p10:#2FD07A;
  --lift-bg:#1F6FEB; --on-lift:#FFFFFF; --scrim:rgba(2,4,8,.7);
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body-font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(900px 420px at 85% -8%,rgba(52,227,200,.10),transparent 62%),radial-gradient(800px 420px at -10% 108%,rgba(47,134,255,.09),transparent 60%),var(--bg);color:var(--fg);font-family:var(--body-font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;background:none;border:none;padding:0}
input,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--mind);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.app{height:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
#title{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.35))}
.brand .mark{width:52px;height:30px}
.wm{font:500 17px 'Montserrat',var(--body-font);letter-spacing:.04em;color:#DCE8F5}
.wm b{font-weight:800;color:#fff}
.icon-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--muted);border:1px solid transparent}
.icon-btn:hover{border-color:var(--line)}
.icon-btn svg{width:22px;height:22px}
#main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:20px;display:flex;flex-direction:column;gap:20px}
#main > *{flex-shrink:0}
.sheet > *,.re-body > *,.g-in > *{flex-shrink:0}

/* buttons */
.primary{min-height:56px;border-radius:16px;background:var(--body);color:var(--on-lift);font:800 17px var(--body-font);letter-spacing:.01em;padding:0 20px;box-shadow:0 8px 28px -10px rgba(47,134,255,.7)}
.primary:active{transform:scale(.985)}
.outline{min-height:54px;border-radius:16px;border:1.5px dashed rgba(52,227,200,.5);color:var(--mind);font-weight:800;background:var(--mind-dim)}
.secondary{min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;padding:0 16px}
.danger{color:var(--bad)}
.link{color:var(--mind);font-weight:700;font-size:15px;padding:6px 0}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:600 13px var(--body-font);white-space:nowrap;flex:none;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--mind-dim);color:var(--mind);border-color:rgba(52,227,200,.55)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{min-height:42px;padding:0 18px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--mind-dim);color:var(--mind)}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.section-h h2{font:700 14px var(--display);text-transform:uppercase;letter-spacing:.06em}

/* hero */
.hero{position:relative;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:16px;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(120deg,rgba(52,227,200,.7),rgba(52,227,200,.05) 45%,rgba(47,134,255,.05) 55%,rgba(47,134,255,.7)) border-box;border:1px solid transparent;overflow:hidden}
.hero h2{font:700 clamp(22px,6.4vw,28px)/1.15 var(--display);letter-spacing:-.01em}
.hero h2 .m{color:var(--mind)}.hero h2 .b{color:var(--body)}
.hero-stats{display:flex;gap:22px}
.hero-stats div{display:flex;flex-direction:column;gap:2px}
.hero-stats b{font:600 20px var(--display);font-variant-numeric:tabular-nums}

/* cards & lists */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
button.card:hover{border-color:#2D3746}
.card h3{font:800 17px/1.2 var(--body-font)}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .lines{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.stack{display:flex;flex-direction:column;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0}
.tile b{display:block;font:600 16px/1.2 var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile span{font-size:12px;color:var(--muted)}
.empty{padding:28px 8px;text-align:center;color:var(--muted);font-size:15px}

/* workout editor */
.wk-head{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.wk-name{font:700 20px/1.2 var(--display);border:none;background:none;width:100%;padding:0}
.wk-stats{display:flex;gap:20px}
.wk-stats div{display:flex;flex-direction:column}
.wk-stats b{font:600 17px var(--mono);font-variant-numeric:tabular-nums}
.wk-stats div:first-child b{color:var(--body)}
.wk-actions{display:flex;gap:8px}
.wk-actions .primary{flex:1;min-height:48px}
.ex{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.ex-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex-name{font:800 17px/1.2 var(--body-font);color:var(--mind);text-align:left}
.ex-meta{font-size:13px;color:var(--muted)}
.note{border:none;background:none;width:100%;font-size:14px;color:var(--fg);padding:2px 0}
.note::placeholder{color:var(--muted)}
.sets{display:flex;flex-direction:column;gap:5px}
.srow{display:grid;grid-template-columns:34px minmax(0,1fr) repeat(var(--n),64px) 42px;gap:6px;align-items:center;border-radius:12px;padding:3px 2px;transition:background .2s}
.srow.head{font:600 10px var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase;text-align:center}
.srow.head span:nth-child(2){text-align:left}
.srow.done{background:var(--good-tint)}
.srow.flash{animation:flash 1.2s}
@keyframes flash{0%,40%{box-shadow:0 0 0 2px var(--mind)}}
.stag{height:38px;font:700 14px var(--mono);border-radius:10px;color:var(--muted)}
.stag.k-w{color:var(--p15)}.stag.k-d{color:var(--p20)}.stag.k-f{color:var(--p25)}
.prev{text-align:left;font:500 12px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:38px}
.fin,.rin{height:38px;width:100%;min-width:0;border:1px solid transparent;border-radius:10px;background:var(--surface-2);text-align:center;font:600 15px var(--mono);font-variant-numeric:tabular-nums}
.fin:focus,.rin:focus{border-color:rgba(52,227,200,.6);outline:none;box-shadow:0 0 0 3px var(--mind-dim)}
.fin::placeholder,.rin::placeholder{color:var(--muted);opacity:.65}
.srow.done .fin{background:transparent}
.chk{width:40px;height:38px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.chk svg{width:18px;height:18px}
.srow.done .chk{background:var(--good);color:#04140B;box-shadow:0 0 18px -4px var(--good)}
.srow.re{grid-template-columns:34px repeat(var(--n),minmax(0,1fr)) 42px}
.re-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-bottom:8px}
.re-tools{display:flex;gap:2px;flex:none}
.re-tools .icon-btn{font-size:18px;color:var(--fg)}
.re-tools .danger{color:var(--bad)}
.add-set{min-height:40px;border-radius:12px;background:var(--surface-2);font-weight:700;font-size:14px;color:var(--muted)}

/* dock */
.dock{flex:none;display:flex;flex-direction:column;gap:8px;padding-top:8px}
.restdock{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(52,227,200,.35);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 0 30px -12px rgba(52,227,200,.6)}
.restdock.over{background:var(--lift-bg);color:var(--on-lift);border-color:var(--lift-bg);box-shadow:0 0 30px -10px rgba(47,134,255,.8)}
.rd-row{display:flex;align-items:center;gap:8px}
.rd-clock{font:600 24px/1 var(--display);font-variant-numeric:tabular-nums;min-width:72px;color:var(--mind)}
.restdock.over .rd-clock{color:var(--on-lift)}
.rd-label{flex:1;min-width:0;font-size:13px;color:var(--muted);line-height:1.3}
.restdock.over .rd-label{color:var(--on-lift);font-weight:600}
.rd-btn{min-height:38px;padding:0 10px;border-radius:10px;background:var(--surface-2);font-weight:700;font-size:13px}
.rd-play{background:var(--mind);color:#03201B;padding:0 14px}
.restdock.over .rd-btn{background:rgba(255,255,255,.18);color:var(--on-lift)}
.bar{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--mind);transform-origin:left;transition:transform .25s linear;box-shadow:0 0 10px var(--mind)}
.warn .bar i{background:var(--p15);box-shadow:0 0 10px var(--p15)}
.warn .rd-clock,.warn .g-clock{color:var(--p15)}
.warn .prog{stroke:var(--p15)}
.minibar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--body-dim);border:1px solid rgba(47,134,255,.45);color:var(--fg);border-radius:14px;padding:12px 14px;text-align:left}
.minibar b{font:800 15px var(--body-font)}
.minibar .mono{color:var(--body);font-weight:700}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;margin-bottom:8px}
.tabbar button{min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.02em;position:relative}
.tabbar svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--mind)}
.tabbar button[aria-current="page"]::after{content:"";position:absolute;top:6px;width:4px;height:4px;border-radius:50%;background:var(--mind);box-shadow:0 0 8px var(--mind)}

/* overlays */
.ov{position:fixed;inset:0;display:flex;z-index:60}
.sheet-ov{background:var(--scrim);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);align-items:flex-end;padding:env(safe-area-inset-top,0px) max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:600px;margin:0 auto;background:#0B0E14;border:1px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:88%;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
.sheet.full{height:92%;max-height:92%;overflow:hidden}
.sheet h2{font:700 19px/1.2 var(--display)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.menu{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.menu button{min-height:52px;text-align:left;border-bottom:1px solid var(--line);font-weight:600;padding:0 16px}
.menu button:last-child{border-bottom:none}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.input{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;width:100%}
.input:focus{border-color:rgba(52,227,200,.6);outline:none}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px;font-weight:600}
.toggle input{width:22px;height:22px;accent-color:var(--mind)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:700;z-index:90;max-width:calc(100% - 32px)}

/* picker */
.pick-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;margin-inline:-4px}
.pick{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:60px;padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.pick b{display:block;font-weight:700;font-size:15px}
.pick span{font-size:13px;color:var(--muted)}
.pick .box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line)}
.pick[aria-pressed="true"] .box{background:var(--mind);border-color:var(--mind);box-shadow:0 0 12px -2px var(--mind)}
.pick-group{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 4px 4px}
.tag{font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted)}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.weeks{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;align-items:end;height:72px}
.weeks div{background:var(--surface-2);border-radius:6px 6px 2px 2px;min-height:4px}
.weeks div.now{background:var(--mind);box-shadow:0 0 14px -2px var(--mind)}
.weeks-l{display:flex;justify-content:space-between;font:500 11px var(--mono);color:var(--muted)}

/* brain gym */
.gamegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcard{text-align:left;border-radius:18px;padding:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;min-width:0}
.gcard:hover{border-color:rgba(52,227,200,.5)}
.gcard .gi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--mind-dim);color:var(--mind);font:700 15px var(--display)}
.gcard b{font:800 16px/1.2 var(--body-font)}
.gcard span{font-size:13px;color:var(--muted)}
.gcard .best{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mind)}
/* daily word */
.daily-card{width:100%;text-align:left;display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(120deg,rgba(52,227,200,.75),rgba(255,192,46,.35)) border-box;border:1px solid transparent}
.dc-mini{display:grid;grid-template-columns:repeat(5,16px);gap:3px;flex:none}
.dc-mini i{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;font:700 9px var(--mono);font-style:normal;background:var(--surface-2);color:var(--muted)}
.dc-txt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.dc-txt b{font:800 16px/1.2 var(--body-font)}
.dc-txt>span:last-child{font-size:13px;color:var(--muted)}
.dc-streak{font:700 13px var(--mono);color:var(--p15);flex:none}
.dt-g{background:var(--mind)!important;color:#05211C!important;border-color:var(--mind)!important}
.dt-y{background:var(--p15)!important;color:#2A1C00!important;border-color:var(--p15)!important}
.dt-x{background:#2A323E!important;color:#C9D2DD!important;border-color:#2A323E!important}
.daily-ov .sheet{gap:12px}
.dw-grid{display:grid;gap:6px;justify-content:center;margin-top:4px}
.dw-row{display:grid;grid-template-columns:repeat(5,min(15vw,58px));gap:6px}
.dw-t{aspect-ratio:1;display:grid;place-items:center;border:2px solid var(--line);border-radius:10px;font:700 min(7vw,28px) var(--display);text-transform:uppercase}
.dw-t.dt-typed{border-color:#4A5566;animation:pop .1s}
.dw-t.flip{animation:dflip .5s both}
.dw-row.shake{animation:dshake .4s}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes dflip{0%{transform:rotateX(0);background:transparent;color:var(--fg);border-color:#4A5566}49%{background:transparent;color:var(--fg);border-color:#4A5566}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
@keyframes dshake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.dw-t.flip,.dw-row.shake,.dw-t.dt-typed{animation:none}}
.dw-msg{min-height:20px;text-align:center;font-weight:700;font-size:14px}
.dw-kb{display:flex;flex-direction:column;gap:7px;user-select:none;-webkit-user-select:none}
.dw-kb>div{display:flex;gap:5px;justify-content:center}
.dw-k{flex:1;max-width:44px;height:54px;border-radius:9px;background:#3A4453;font:700 15px var(--body-font)}
.dw-k.wide{max-width:66px;flex:1.5;font-size:12px}
.dw-done{gap:14px}
.dw-ans{display:flex;flex-direction:column;align-items:center;gap:2px}
.dw-ans b{font:700 28px var(--display);letter-spacing:.12em;color:var(--mind)}
.dw-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.dw-stats b{display:block;font:700 22px var(--display);white-space:nowrap}
.dw-stats span{font-size:12px;color:var(--muted)}
.dw-k.dt-x{background:#12161D!important;color:#566273!important;border-color:#12161D!important}
.dw-dist{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.dw-dist>div{display:flex;align-items:center;gap:8px;font:600 12px var(--mono)}
.dw-dist i{font-style:normal;background:var(--surface-2);border-radius:5px;padding:2px 6px;text-align:right;min-width:22px}
.dw-dist i.me{background:var(--mind);color:#05211C}
.dw-friend{display:flex;align-items:center;gap:10px}
.dw-friend b{font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dw-pat{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.dw-pat>span{display:grid;grid-template-columns:repeat(5,6px);gap:1px}
.dw-pat i{width:6px;height:6px;border-radius:1.5px}
.g-free{display:flex;flex-direction:column;gap:4px}
.g-free b{font:700 20px var(--display)}
/* welcome */
.welcome{z-index:80;background:radial-gradient(700px 400px at 100% 0%,rgba(52,227,200,.16),transparent 60%),radial-gradient(700px 400px at 0% 100%,rgba(47,134,255,.14),transparent 60%),var(--bg);overflow-y:auto;padding:env(safe-area-inset-top,0px) max(20px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(20px,env(safe-area-inset-left,0px))}
.w-in{margin:auto;width:100%;max-width:440px;display:flex;flex-direction:column;gap:22px;padding-block:32px}
.w-logo{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-bottom:6px}
.w-logo .mark{width:min(78%,300px);aspect-ratio:360/205}
.w-logo .wm{font-size:clamp(26px,8vw,34px)}
.w-in h1{text-align:left}
.w-in h1{font:700 clamp(30px,9vw,40px)/1.08 var(--display);letter-spacing:-.02em}
.w-in h1 .m{color:var(--mind)}.w-in h1 .b{color:var(--body)}
.w-steps{display:flex;flex-direction:column;gap:14px}
.w-step{display:flex;gap:14px;align-items:flex-start}
.w-step i{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font:700 14px var(--display);font-style:normal}
.w-step b{display:block;font-weight:800}
.w-step span{color:var(--muted);font-size:14px}

/* game overlay */
.gameov{z-index:50;background:radial-gradient(600px 300px at 50% 0%,rgba(52,227,200,.12),transparent 70%),var(--bg);flex-direction:column;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.g-wrap{width:100%;max-width:560px;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding-block:10px}
.g-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.g-timer{display:flex;align-items:center;gap:14px}
.ringwrap{position:relative;width:86px;height:86px;flex:none}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .track{stroke:var(--surface-2)}
.ringwrap .prog{stroke:var(--mind);filter:drop-shadow(0 0 6px rgba(52,227,200,.8));transition:stroke-dashoffset .25s linear}
.g-clock{position:absolute;inset:0;display:grid;place-items:center;font:600 19px var(--display);font-variant-numeric:tabular-nums;color:var(--mind)}
.g-next{font-size:14px;color:var(--muted);line-height:1.35}
.g-next b{display:block;color:var(--fg);font-size:15px}
.game{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-bottom:8px}
.lock{position:absolute;inset:0;background:radial-gradient(500px 300px at 50% 0%,rgba(255,255,255,.18),transparent 70%),var(--lift-bg);color:var(--on-lift);display:flex;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.lock-in{margin:auto;width:100%;max-width:480px;display:flex;flex-direction:column;gap:16px;padding-block:24px}
.lock .eyebrow{color:var(--on-lift);opacity:.75}
.lock-ex{font:700 clamp(28px,8.5vw,42px)/1.1 var(--display);letter-spacing:-.01em;overflow-wrap:anywhere}
.lock-target{font:700 19px var(--mono);font-variant-numeric:tabular-nums;padding-block:12px;border-top:1px solid rgba(255,255,255,.3);border-bottom:1px solid rgba(255,255,255,.3)}
.lock-clock{font-size:14px;font-weight:600;opacity:.8}
.lock-done{min-height:64px;border-radius:18px;background:var(--on-lift);color:var(--lift-bg);font:800 18px var(--body-font)}
.lock .link{color:var(--on-lift);align-self:center}

/* games */
.g-head{display:flex;justify-content:space-between;gap:8px;font:500 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.g-head b{color:var(--fg)}
.prompt{font:600 clamp(36px,11vw,56px)/1 var(--display);text-align:center;padding-block:16px 6px;font-variant-numeric:tabular-nums}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{min-height:68px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font:700 24px var(--mono);font-variant-numeric:tabular-nums}
.choice.word{font:700 15px var(--display);text-transform:uppercase;letter-spacing:.04em}
.hint,.status{text-align:center;color:var(--muted);font-size:14px}
.status{font-weight:700;color:var(--fg);font-size:16px;min-height:22px}
.again{align-self:center;min-height:50px;padding:0 24px;border-radius:14px;background:var(--mind);color:#03201B;font-weight:800}
.good{animation:good .4s}.bad{animation:bad .4s}.shake{animation:shake .32s}
@keyframes good{0%{background:var(--good);color:#04140B;border-color:var(--good)}}
@keyframes bad{0%{background:var(--bad);color:#fff;border-color:var(--bad)}}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(100%,320px);margin:0 auto}
.pad{position:relative;aspect-ratio:1;border-radius:50%;opacity:.3;background:radial-gradient(circle,var(--bg) 0 9%,rgba(0,0,0,.35) 9% 14%,transparent 14%),var(--c);transition:opacity .08s,transform .08s}
.pad span{position:absolute;left:0;right:0;top:16%;font:700 18px var(--display);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.pad.lit{opacity:1;transform:scale(.95);box-shadow:0 0 0 3px var(--fg),0 0 30px var(--c)}
.p0{--c:var(--p25)}.p1{--c:var(--p20)}.p2{--c:var(--p15)}.p3{--c:var(--p10)}
.hunt{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(100%,400px);margin:0 auto}
.hunt button{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:700 19px var(--mono)}
.hunt button.done{opacity:.15}
.result{text-align:center;display:flex;flex-direction:column;gap:12px;padding-block:24px}
.result b{font:600 42px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--mind)}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;padding-top:12px}
.slots span{width:30px;height:42px;border-bottom:3px solid var(--line);display:grid;place-items:center;font:700 20px var(--display)}
.slots span.reveal{color:var(--bad)}
.ltiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.ltiles button{width:46px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:700 18px var(--display)}
.ltiles button:disabled{opacity:.15}
.grow{display:flex;justify-content:center;gap:8px}
.grow button{min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:700}
.odd{display:grid;gap:6px;width:min(100%,360px);aspect-ratio:1;margin:0 auto}
.odd button{border-radius:10px;min-width:0;min-height:0}
.odd button.reveal{outline:3px solid var(--fg);outline-offset:2px}
.react{min-height:280px;border-radius:24px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center}
.react b{font:700 30px/1 var(--display);text-transform:uppercase;font-variant-numeric:tabular-nums}
.react small{font-size:14px;opacity:.85}
.react.wait{background:var(--bad);color:#fff;border-color:var(--bad)}
.react.go{background:var(--good);color:#04140B;border-color:var(--good)}
.pairs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(100%,360px);margin:0 auto}
.pairs button{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:repeating-linear-gradient(45deg,var(--surface-2) 0 6px,var(--surface) 6px 12px);font:32px/1 var(--body-font);color:transparent}
.pairs button.up{background:var(--surface);color:var(--sym)}
.pairs button.matched{background:var(--surface);color:var(--sym);opacity:.35}
/* ---------- accounts, feed, programs ---------- */
.gate{z-index:85;background:radial-gradient(700px 400px at 100% 0%,rgba(52,227,200,.14),transparent 60%),radial-gradient(700px 400px at 0% 100%,rgba(47,134,255,.14),transparent 60%),var(--bg);overflow-y:auto;padding:env(safe-area-inset-top,0px) max(20px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(20px,env(safe-area-inset-left,0px))}
.g-in{margin:auto;width:100%;max-width:440px;display:flex;flex-direction:column;gap:16px;padding-block:28px}
.g-in h1{font:700 clamp(24px,7vw,30px)/1.15 var(--display);letter-spacing:-.01em}
.g-in .w-logo .mark{width:min(60%,220px)}
.g-in .w-logo .wm{font-size:26px}
.g-err{color:var(--bad);font-size:14px;font-weight:600;min-height:0}
.g-err:empty{display:none}
.g-note{font-size:13px;color:var(--muted);text-align:center}

.pick-att{display:flex;gap:8px;flex-wrap:wrap}
.pick-att .secondary{min-height:42px;font-size:14px;padding:0 12px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:76px;height:76px;border-radius:12px;overflow:hidden;background:#000}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:13px}
.cmt{display:flex;gap:10px;align-items:flex-start}
.cmt-b{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.cmt-b b{font-size:13px}
.cmt-b p{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.cmt-b .link{font-size:12px;align-self:flex-start;padding:2px 0;color:var(--muted)}
.cmt-in{display:flex;gap:8px;align-items:flex-end}
.cmt-in .textarea{min-height:46px;height:46px}
.prof{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.prof-top{display:flex;gap:14px;align-items:center;min-width:0}
.prof-top div{min-width:0}
.prof-top h2{font:700 19px/1.2 var(--display);overflow-wrap:anywhere}
.prof-stats{display:flex;gap:22px}
.prof-stats div{display:flex;flex-direction:column}
.prof-stats b{font:600 17px var(--mono)}
.prog{text-align:left;border-radius:20px;padding:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;min-width:0}
.prog.premium{background:linear-gradient(160deg,rgba(47,134,255,.12),transparent 60%),var(--surface);border-color:rgba(47,134,255,.4)}
.prog h3{font:700 17px/1.2 var(--display)}
.prog-meta{display:flex;gap:6px;flex-wrap:wrap}
.prog-cover{margin:-16px -16px 4px;height:140px;background-size:cover;background-position:center}
.plock{display:inline-flex;align-items:center;gap:6px;color:var(--body);font-weight:800;font-size:13px}
.prog-body p{font-size:15px;line-height:1.55;margin:0 0 10px}
.admin-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.admin-row:last-child{border-bottom:none}
.admin-row b{font-family:var(--mono)}
.admin-row span{font-size:13px;color:var(--muted)}
.viewer{z-index:95;background:rgba(0,0,0,.94);align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:20px}
.loadrow{display:flex;justify-content:center;padding:8px}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ================= units ================= */
const KG_LB=2.20462;
const u=()=>ST.settings.unit;
const r1=n=>Math.round(n*10)/10;
const dispW=kg=>kg==null?'':String(r1(u()==='lb'?kg*KG_LB:kg));
const inW=v=>u()==='lb'?v/KG_LB:v;
const dUnit=()=>u()==='lb'?'mi':'km';
const dispD=m=>m==null?'':String(Math.round((u()==='lb'?m/1609.344:m/1000)*100)/100);
const inD=v=>u()==='lb'?v*1609.344:v*1000;
const parseT=s=>{s=String(s).trim();if(!s)return null;if(s.includes(':')){const p=s.split(':').map(Number);if(p.some(isNaN))return null;return p.reduce((a,b)=>a*60+b,0)}const n=parseFloat(s);return isNaN(n)?null:Math.round(n)};
function fieldDisp(f,v){if(v==null)return'';if(f==='w')return dispW(v);if(f==='t')return clock(v);if(f==='d')return dispD(v);return String(v)}
function fieldParse(f,s){s=String(s).trim();if(s==='')return null;if(f==='t')return parseT(s);const n=parseFloat(s.replace(',','.'));if(isNaN(n)||n<0)return null;if(f==='w')return inW(n);if(f==='d')return inD(n);return Math.round(n)}
function colLabel(type,f){if(f==='w')return(type==='b'?'+':type==='a'?'−':'')+u();if(f==='r')return'reps';if(f==='t')return'time';return dUnit()}
function setText(type,s){
  if(!s)return'';
  const w=s.w!=null?dispW(s.w)+' '+u():'';
  switch(type){
    case'w':return s.w!=null&&s.r!=null?`${w} × ${s.r}`:(s.r!=null?`${s.r} reps`:w);
    case'b':return `${s.r??0} reps`+(s.w?` · +${w}`:'');
    case'a':return `${s.r??0} reps`+(s.w?` · −${w}`:'');
    case't':return clock(s.t||0);
    case'wt':return `${w||'0 '+u()} · ${clock(s.t||0)}`;
    case'd':return `${dispD(s.d||0)} ${dUnit()} · ${clock(s.t||0)}`;
    case'c':return `${w||'0 '+u()} · ${dispD(s.d||0)} ${dUnit()}`;
  }return'';
}
const e1rm=s=>s.w&&s.r?(s.r===1?s.w:s.w*(1+s.r/30)):0;
const volOf=w=>w.exercises.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+((s.done!==false)&&s.w&&s.r&&(e.type==='w'||e.type==='b')?s.w*s.r:0),0),0);
const fmtVol=kg=>Math.round(u()==='lb'?kg*KG_LB:kg).toLocaleString()+' '+u();

/* ================= cloud save (falls back to this device) ================= */
const Cloud={ok:false,mode:null,cols:{},q:Promise.resolve(),aq:Promise.resolve(),aTimer:null,
  async init(){
    try{
      if(LIVE||!window.claude||!window.claude.use)return;
      const [d,usr]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      if(!d||!usr)return;const id=await usr.id();if(!id)return;
      const root=`data/users/${id}`,prof=d.doc(root+'/profile');
      this.cols={workouts:prof.collection('workouts'),routines:prof.collection('routines'),custom:prof.collection('exercises')};
      this.settingsRef=d.doc(root+'/settings');this.activeRef=d.doc(root+'/active');this.ok=true;
      const s=await this.settingsRef.get();
      if(s.exists){ST.settings=Object.assign({},DEF_SETTINGS,clone(s.data().v||{}));LS.set('settings',ST.settings)}else this.saveSettings();
      const a=await this.activeRef.get();
      if(a.exists){const v=a.data().v;if(v&&(!ST.active||(v.updated||0)>(ST.active.updated||0))){ST.active=clone(v);LS.set('active',ST.active)}}
      ST.cloud=true;
      ['workouts','routines','custom'].forEach(k=>{
        let migrated=false;
        this.cols[k].onSnapshot(snap=>{
          const arr=snap.docs.map(x=>clone(x.data()));
          if(!arr.length&&ST[k].length){if(!snap.metadata.fromCache&&!migrated){migrated=true;ST[k].forEach(it=>this.put(k,it))}return}
          ST[k]=arr;LS.set(k,arr);
          if(k==='custom')rebuildEx();if(k==='workouts')rebuildHistory();
          softRender();
        },()=>{});
      });
      softRender();renderDock();
    }catch(e){}
  },
  put(k,o){if(!this.ok)return;if(this.mode==='live'){this.q=this.q.then(()=>API.putDoc(KIND[k],o.id,o)).catch(()=>toast('Couldn’t sync. Saved on this phone.'));return}this.q=this.q.then(()=>this.cols[k].doc(o.id).set(o)).catch(()=>toast('Couldn’t sync. Saved on this device.'))},
  del(k,id){if(!this.ok)return;if(this.mode==='live'){this.q=this.q.then(()=>API.delDoc(KIND[k],id)).catch(()=>{});return}this.q=this.q.then(()=>this.cols[k].doc(id).delete()).catch(()=>{})},
  saveSettings(){if(!this.ok)return;if(this.mode==='live'){const v=clone(ST.settings);this.q=this.q.then(()=>API.putDoc('settings','main',v)).catch(()=>{});return}const v=clone(ST.settings);this.q=this.q.then(()=>this.settingsRef.set({v})).catch(()=>{})},
  saveActive(){
    if(!this.ok)return;clearTimeout(this.aTimer);
    this.aTimer=setTimeout(()=>{const v=ST.active?clone(ST.active):null;if(this.mode==='live'){this.aq=this.aq.then(()=>v?API.putDoc('active','current',v):API.delDoc('active','current')).catch(()=>{});return}this.aq=this.aq.then(()=>v?this.activeRef.set({v}):this.activeRef.delete()).catch(()=>{})},2000);
  },
};

function putItem(k,o){ST[k]=ST[k].filter(x=>x.id!==o.id).concat([o]);LS.set(k,ST[k]);Cloud.put(k,o);if(k==='custom')rebuildEx();if(k==='workouts')rebuildHistory()}
function delItem(k,id){ST[k]=ST[k].filter(x=>x.id!==id);LS.set(k,ST[k]);Cloud.del(k,id);if(k==='custom')rebuildEx();if(k==='workouts')rebuildHistory()}

const newSet=(base)=>({id:newId(),kind:base?.kind||'n',w:base?.w??null,r:base?.r??null,t:base?.t??null,d:base?.d??null,done:false});
const newEx=(exId,sets)=>({uid:newId(),exId,name:EXMAP[exId]?.name,type:EXMAP[exId]?.type||'w',rest:null,note:'',sets:sets||[newSet()]});
function startWorkout(from){
  if(ST.active){toast('Finish or discard your current workout first.');return}
  const h=new Date().getHours();
  const name=from?.name||(h<11?'Morning workout':h<17?'Afternoon workout':'Evening workout');
  ST.active={id:newId(),name,start:Date.now(),exercises:(from?.exercises||[]).filter(e=>EXMAP[e.exId]).map(e=>Object.assign(newEx(e.exId,e.sets.map(s=>newSet(s))),{rest:e.rest??null,note:e.note||''})),restEnd:0,restTotal:0,restAfter:null,restOver:false};
  saveActive(true);setTab('workout');wake();
}
function setLabel(sets,j){const k=sets[j].kind;if(k==='w')return'W';if(k==='d')return'D';if(k==='f')return'F';let n=0;for(let i=0;i<=j;i++)if(sets[i].kind==='n')n++;return String(n)}
const prevFor=(exId,j)=>(lastSets[exId]||[])[j];
function nextSet(){
  const A=ST.active;if(!A)return null;const ex=A.exercises;if(!ex.length)return null;
  const start=A.restAfter||{i:0,j:-1};
  const order=[];for(let k=0;k<ex.length;k++){const i=(start.i+k)%ex.length;ex[i].sets.forEach((s,j)=>{if(k===0&&j<=start.j)return;order.push({i,j})})}
  ex[start.i]&&ex[start.i].sets.forEach((s,j)=>{if(j<=start.j)order.push({i:start.i,j})});
  return order.find(p=>!ex[p.i].sets[p.j].done)||null;
}
const resting=()=>!!(ST.active&&ST.active.restEnd&&ST.active.restEnd>Date.now());
function completeSet(i,j){
  const A=ST.active,x=A.exercises[i],s=x.sets[j],fields=TYPES[x.type]||TYPES.w,p=prevFor(x.exId,j);
  const filled={};fields.forEach(f=>{filled[f]=s[f]!=null?s[f]:(p&&p[f]!=null?p[f]:null)});
  const need={w:['r'],b:['r'],a:['r'],t:['t'],wt:['t'],d:['d','t'],c:['w','d']}[x.type]||['r'];
  const ok=need.some(f=>filled[f]>0);
  if(!ok)return false;
  Object.assign(s,filled);s.done=true;
  startRest(i,j);return true;
}
function startRest(i,j){
  const A=ST.active,x=A.exercises[i],rest=x.rest??ST.settings.rest;
  A.restAfter={i,j};A.restOver=false;
  if(rest>0){A.restEnd=Date.now()+rest*1000;A.restTotal=rest*1000;restFired=false;warned=false;ensureAudio();if(ST.settings.autoGame)openGame()}
  else{A.restEnd=0}
  if(A.restEnd)N('restStart',A.restEnd,restLabel());else N('restCancel');
  saveActive();renderDock();syncPause();updateLock();
}

  const wk=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x.getTime()};
  const now=wk(Date.now()),counts=Array(8).fill(0);

  <div class="card"><span class="eyebrow">Workouts per week</span><div class="weeks">${counts.map((c,k)=>`<div class="${k===7?'now':''}" style="height:${c/mx*100}%" title="${c}"></div>`).join('')}</div><div class="weeks-l"><span>8 weeks ago</span><span>This week</span></div></div>
  <div class="stack">${W.map(w=>`<button class="card" style="text-align:left" data-act="hist-open" data-id="${w.id}">

    <div class="lines">${w.exercises.slice(0,4).map(e=>`<span>${e.sets.length} × ${esc(exOf(e).name)}</span>`).join('')}${w.exercises.length>4?`<span>and ${w.exercises.length-4} more</span>`:''}</div></button>`).join('')}</div>`;

/* ================= tick: clocks, rest end ================= */
let restFired=true,warned=true;
function tick(){
  const A=ST.active;if(!A)return;const now=Date.now();
  const d=$('#wkDur');if(d)d.textContent=clock((now-A.start)/1000);
  const m=$('#mbDur');if(m)m.textContent=clock((now-A.start)/1000);
  if(A.restEnd){
    const left=A.restEnd-now;
    if(left<=0){A.restEnd=0;A.restOver=true;saveActive();if(!restFired){restFired=true;alertEnd();N('restEnd')}renderDock();syncPause();updateLock();return}
    if(left<=10000&&!warned){warned=true;if(A.restTotal>15000)beep(660,.12)}
    const txt=clock(Math.ceil(left/1000)),sc=`scaleX(${Math.max(0,left/A.restTotal)})`,warn=left<=10000;
    const c=$('#rdClock');if(c){c.textContent=txt;$('#rdBar').style.transform=sc;$('#rdBox').classList.toggle('warn',warn)}
    $('#gClock').textContent=txt;$('#gRing').style.strokeDashoffset=(276.46*(1-Math.max(0,left/A.restTotal))).toFixed(1);$('#gtimer').classList.toggle('warn',warn);
  }

}

function mathProblem(level){
  const ops=level<2?['+','−']:level<4?['+','−','×']:['+','−','×','÷'];
  const op=ops[rnd(0,ops.length-1)],m=Math.min(level,6);let a,b,ans;
  if(op==='+'){a=rnd(5,15*m);b=rnd(5,15*m);ans=a+b}
  else if(op==='−'){a=rnd(12,20*m);b=rnd(2,a-1);ans=a-b}
  else if(op==='×'){a=rnd(2,4+2*m);b=rnd(2,8+m);ans=a*b}
  else{b=rnd(2,8+m);ans=rnd(2,8+m);a=b*ans}
  return{text:`${a} ${op} ${b}`,ans};
}
function mountMath(root){
  let score=0,cur;
  root.innerHTML=`<div class="g-head"><span>Streak <b data-s>0</b></span><span>Best <b data-b>${bestG('math')??0}</b></span></div><div class="prompt" data-q></div><div class="choices" data-c></div><p class="hint">Tap the answer. A miss resets your streak.</p>`;

      <text x="${W-R}" y="${H-6}" text-anchor="end" font-size="11" font-family="JetBrains Mono,monospace" fill="var(--muted)">${new Date(pts[pts.length-1].t).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</text></svg></div>`;

    ${sessions.length?`<button class="primary" data-act="share-lift" data-id="${esc(id)}">Share my best lift</button>`:''}${ST.active?'<button class="outline" id="eAdd">Add to workout</button>':''}${e.custom?'<button class="secondary danger" id="eDel">Delete custom exercise</button>':''}`);
  const a=o.querySelector('#eAdd');if(a)a.onclick=()=>{ST.active.exercises.push(newEx(id));saveActive();o.close();setTab('workout')};

}
function openRoutineEditor(src){
  const isNew=!src||src.template,d=src?clone(src):{name:'',exercises:[]};
  if(isNew){d.id='r-'+newId();delete d.template}
  let dirty=false;
  const o=sheet(`<div class="sheet-h"><button class="link" id="reCancel">Cancel</button><h2>${isNew?'New routine':'Edit routine'}</h2><button class="link" id="reSave">Save</button></div>
    <input class="wk-name" id="reName" placeholder="Routine name" value="${esc(d.name)}" aria-label="Routine name">
    <div class="re-body" id="reBody"></div>`,{full:true,modal:true});
  const body=o.querySelector('#reBody');
  const rests=[[null,'Default rest'],[0,'No rest'],[30],[45],[60],[90],[120],[180],[240],[300]];
  function draw(){
    const st=body.scrollTop;
    body.innerHTML=d.exercises.map((x,i)=>{
      const ex=EXMAP[x.exId]||{name:'Exercise',muscle:'',type:'w'},type=ex.type,f=TYPES[type]||TYPES.w;
      return `<section class="ex"><div class="ex-top"><div><b class="ex-name" style="color:var(--fg)">${esc(ex.name)}</b><div class="ex-meta">${esc(ex.muscle)}</div></div>
        <div class="re-tools">${i>0?`<button class="icon-btn" data-ra="up" data-i="${i}" aria-label="Move up">↑</button>`:''}${i<d.exercises.length-1?`<button class="icon-btn" data-ra="down" data-i="${i}" aria-label="Move down">↓</button>`:''}<button class="icon-btn danger" data-ra="rm" data-i="${i}" aria-label="Remove exercise">✕</button></div></div>
        <select class="input" data-rest="${i}" aria-label="Rest timer">${rests.map(([v,l])=>`<option value="${v}" ${v===(x.rest??null)?'selected':''}>${l||'Rest '+clock(v)}</option>`).join('')}</select>
        <div class="sets"><div class="srow head re" style="--n:${f.length}"><span>Set</span>${f.map(k=>`<span>${colLabel(type,k)}</span>`).join('')}<span></span></div>
        ${x.sets.map((s,j)=>`<div class="srow re" style="--n:${f.length}"><button class="stag k-${s.kind||'n'}" data-ra="kind" data-i="${i}" data-j="${j}" aria-label="Set type, tap to change">${setLabel(x.sets,j)}</button>${f.map(k=>`<input class="rin" data-i="${i}" data-j="${j}" data-f="${k}" inputmode="decimal" value="${fieldDisp(k,s[k])}" placeholder="—" aria-label="${colLabel(type,k)}">`).join('')}<button class="chk" data-ra="delset" data-i="${i}" data-j="${j}" aria-label="Delete set">✕</button></div>`).join('')}</div>
        <button class="add-set" data-ra="addset" data-i="${i}">+ Add set</button></section>`;
    }).join('')
    +(d.exercises.length?'':'<p class="empty">Add exercises, then set your target sets, weight and reps. Tap a set number to make it a warm-up, drop or failure set.</p>')
    +`<button class="outline" data-ra="add">+ Add exercise</button>`
    +(isNew?'':'<button class="secondary danger" data-ra="del">Delete routine</button>');
    body.scrollTop=st;
  }
  body.addEventListener('click',e=>{
    const b=e.target.closest('[data-ra]');if(!b)return;const i=+b.dataset.i,j=+b.dataset.j,ex=d.exercises;
    switch(b.dataset.ra){
      case'add':openPicker({onDone:ids=>{ids.forEach(id=>ex.push({exId:id,rest:null,note:'',sets:[0,1,2].map(()=>({kind:'n',w:null,r:EXMAP[id]?.type==='t'?null:null,t:null,d:null}))}));dirty=true;draw();body.scrollTop=body.scrollHeight}});return;
      case'up':[ex[i-1],ex[i]]=[ex[i],ex[i-1]];break;
      case'down':[ex[i+1],ex[i]]=[ex[i],ex[i+1]];break;
      case'rm':ex.splice(i,1);break;
      case'kind':{const s=ex[i].sets[j],ks=['n','w','d','f'];s.kind=ks[(ks.indexOf(s.kind||'n')+1)%4];break}
      case'delset':ex[i].sets.splice(j,1);break;
      case'addset':{const l=ex[i].sets[ex[i].sets.length-1];ex[i].sets.push(l?{kind:l.kind==='w'?'n':l.kind,w:l.w,r:l.r,t:l.t,d:l.d}:{kind:'n',w:null,r:null,t:null,d:null});break}
      case'del':if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Tap again to delete routine';return}delItem('routines',d.id);o.close();toast('Routine deleted');softRender();return;
    }
    dirty=true;draw();
  });
  body.addEventListener('change',e=>{const t=e.target;if(t.dataset.rest!=null){const v=t.value;d.exercises[+t.dataset.rest].rest=v==='null'?null:+v;dirty=true}});
  body.addEventListener('input',e=>{const t=e.target;if(!t.classList.contains('rin'))return;d.exercises[+t.dataset.i].sets[+t.dataset.j][t.dataset.f]=fieldParse(t.dataset.f,t.value);dirty=true});
  body.addEventListener('focusout',e=>{const t=e.target;if(!t.classList.contains('rin'))return;const s=d.exercises[+t.dataset.i]?.sets[+t.dataset.j];if(s)t.value=fieldDisp(t.dataset.f,s[t.dataset.f])});
  o.querySelector('#reName').addEventListener('input',e=>{d.name=e.target.value;dirty=true});
  const cancel=o.querySelector('#reCancel');
  cancel.onclick=()=>{if(dirty&&!cancel.dataset.armed){cancel.dataset.armed='1';cancel.textContent='Discard?';return}o.close()};
  o.querySelector('#reSave').onclick=()=>{
    if(!d.name.trim()){pulse(o.querySelector('#reName'),'shake');o.querySelector('#reName').focus();toast('Give your routine a name');return}
    if(!d.exercises.length){toast('Add at least one exercise');return}
    d.name=d.name.trim();d.exercises=d.exercises.filter(x=>x.sets.length);
    putItem('routines',d);o.close();toast('Routine saved');setTab('workout');
  };
  draw();
}
function openSettings(){
  const S=ST.settings,rests=[0,30,45,60,90,120,180,240,300];
  const o=sheet(`<div class="sheet-h"><h2>Settings</h2><button class="link" data-close>Done</button></div>
    ${ME.user?accountHTML():''}
    <div class="field"><label>Weight units</label><div class="seg"><button data-u="lb" aria-pressed="${S.unit==='lb'}">lb · mi</button><button data-u="kg" aria-pressed="${S.unit==='kg'}">kg · km</button></div></div>
    <div class="field"><label>Default rest timer</label><div class="chips">${rests.map(v=>`<button class="chip" data-r="${v}" aria-pressed="${v===S.rest}">${v?clock(v):'Off'}</button>`).join('')}</div></div>
    <label class="toggle"><span>Open a game when rest starts</span><input type="checkbox" id="sAuto" ${S.autoGame?'checked':''}></label>
    <label class="toggle"><span>Beep and buzz when rest ends</span><input type="checkbox" id="sSound" ${S.sound?'checked':''}></label>
    ${STANDALONE?`<div class="field"><label>Your data</label><p class="muted" style="font-size:13px">${API.live?'Your log is saved to your account and follows you to any phone. You can also keep a backup file.':'Your log lives on this device. Save a backup now and then, and use it to move to a new phone.'}</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="secondary" id="sExp">Save backup</button><label class="secondary" style="display:inline-flex;align-items:center;cursor:pointer">Restore backup<input type="file" id="sImp" accept="application/json,.json" hidden></label></div></div>
      <button class="outline" id="sShare">Share Brainweight</button>`
    :`<p class="muted" style="font-size:13px">${ST.cloud?'Workouts, routines and settings are saved to your Claude account and follow you across devices.':'Saving on this device only. Open this page signed in to Claude to keep your log across devices.'}</p>`}`);
  if(ME.user)wireAccount(o);
  if(STANDALONE){o.querySelector('#sExp').onclick=exportBackup;o.querySelector('#sImp').onchange=e=>{const f=e.target.files[0];if(f)importBackup(f)};o.querySelector('#sShare').onclick=shareApp}
  o.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{S.unit=b.dataset.u;o.querySelectorAll('[data-u]').forEach(c=>c.setAttribute('aria-pressed',c===b));saveSettings();render()});
  o.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.rest=+b.dataset.r;o.querySelectorAll('[data-r]').forEach(c=>c.setAttribute('aria-pressed',c===b));saveSettings();render()});
  o.querySelector('#sAuto').onchange=e=>{S.autoGame=e.target.checked;saveSettings()};
  o.querySelector('#sSound').onchange=e=>{S.sound=e.target.checked;saveSettings();ensureAudio()};
}

async function prepMedia(file){
  const isVideo=(file.type||'').startsWith('video/')||/\.(mov|mp4|m4v|webm)$/i.test(file.name||'');
  if(isVideo){
    if(file.size>50*1024*1024)throw new Error('Videos can be up to 50 MB, about a minute of phone video.');
    const ext=(file.name.split('.').pop()||'mp4').toLowerCase().replace('m4v','mp4');
    return {blob:file,type:'video',mime:file.type||(ext==='mov'?'video/quicktime':'video/mp4'),ext,preview:URL.createObjectURL(file)};
  }
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const max=1600,sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*sc),h=Math.round(img.naturalHeight*sc);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));
    return {blob,type:'image',mime:'image/jpeg',ext:'jpg',w,h,preview:url};
  }catch(e){
    if(file.size>15*1024*1024)throw new Error('That photo is too large.');
    return {blob:file,type:'image',mime:file.type||'image/jpeg',ext:(file.name.split('.').pop()||'jpg').toLowerCase(),preview:url};
  }
}

// These need a bar to hang from, so home plans skip them unless pull-ups are the goal.
const NEEDS_BAR=['pull-up','chin-up','hanging-leg-raise','toes-to-bar','negative-pull-up'];
const KIND_ORDER={m:0,c:1,i:2,k:3,f:4};
const PLAN_DAYS={

  lowerA:{name:'Lower A',type:'lower',slots:['squatMain','rdl','legPress','legCurl','calf','abs','legExt']},
  lowerB:{name:'Lower B',type:'lower',slots:['hinge','singleLeg','hipThrust','legExt','calf','core2','legCurl']},
  push:{name:'Push',type:'push',slots:['benchMain','ohp','inclinePress','lateral','tricepsPush','tricepsOH','chestFly']},
  pull:{name:'Pull',type:'pull',slots:['hinge','verticalPull','rowMain','row2','rearDelt','curl','hammer']},
  legs:{name:'Legs',type:'lower',slots:['squatMain','rdl','legPress','legCurl','legExt','calf','abs']},
  pushB:{name:'Push B',type:'push',slots:['ohp','inclinePress','chestPress2','lateral2','chestFly','tricepsOH','dip']},
  pullB:{name:'Pull B',type:'pull',slots:['verticalPull','row2','latPulldown','row3','rearDelt','curl2','hammer']},
  legsB:{name:'Legs B',type:'lower',slots:['hinge','frontSquat','hipThrust','singleLeg','legCurl','calf','core2']},
};
const PLAN_SPLITS={2:['fullA','fullB'],3:['fullA','fullB','fullC'],4:['upperA','lowerA','upperB','lowerB'],5:['push','pull','legs','upperA','lowerB'],6:['push','pull','legs','pushB','pullB','legsB']};
const PLAN_LIFTS={
  bench:{name:'Bench press',slot:'benchMain',variant:'benchVariant',helpers:['tricepsOH','rearDelt','inclinePress'],days:['push','upper','full']},
  squat:{name:'Squat',slot:'squatMain',variant:'squatVariant',helpers:['singleLeg','legPress','core2'],days:['lower','full']},
  deadlift:{name:'Deadlift',slot:'hinge',variant:'hingeVariant',helpers:['rdl','rowMain','hipThrust'],days:['lower','pull','full']},
  ohp:{name:'Overhead press',slot:'ohp',variant:'ohpVariant',helpers:['lateral','tricepsOH','rearDelt'],days:['push','upper','full']},
  pullup:{name:'Pull-ups',slot:'verticalPull',variant:'latPulldown',helpers:['row2','curl','rearDelt'],days:['pull','upper','full']},
};
const PLAN_MUSCLES={
  chest:{name:'Chest',slots:['benchMain','inclinePress','chestFly','chestPress2','dip'],days:['push','upper','full']},
  back:{name:'Back',slots:['verticalPull','rowMain','row2','latPulldown','row3'],days:['pull','upper','full']},
  shoulders:{name:'Shoulders',slots:['ohp','lateral','rearDelt','lateral2','ohpVariant'],days:['push','upper','full']},
  arms:{name:'Arms',slots:['curl','tricepsPush','hammer','tricepsOH','curl2'],days:['pull','push','upper','full']},
  legs:{name:'Legs',slots:['squatMain','legPress','rdl','legCurl','legExt','singleLeg'],days:['lower','full']},
  glutes:{name:'Glutes',slots:['hipThrust','glute2','singleLeg','rdl','glute3'],days:['lower','full']},
  core:{name:'Core',slots:['abs','core2','obliques'],days:['lower','pull','full','upper','push']},
};
const PLAN_GOALS={lift:'Get stronger at a lift',muscle:'Hit a muscle hard',size:'Build muscle',strength:'Get stronger overall',lean:'Get lean and fit'};

function planPick(slot,equip,avoid,barOK){
  const allowed=PLAN_EQUIP[equip];
  const list=(PLAN_SLOTS[slot]||[]).filter(id=>EXMAP[id]&&(!allowed||allowed.includes(EXMAP[id].equip))&&(equip==='gym'||barOK||!NEEDS_BAR.includes(id)));
  return list.find(id=>!avoid.has(id))||null;
}
// Round a weight (in the person's units) to a plate-friendly number, then store it in kg.
function planWeight(userUnitWeight){
  if(!userUnitWeight||userUnitWeight<=0)return null;
  const step=u()==='lb'?5:2.5;
  return inW(Math.max(step,Math.round(userUnitWeight/step)*step));
}
function scheme(goal,kind,exp){
  // [sets, reps, rest seconds]
  const S={
    strength:{m:[5,5,180],c:[3,8,120],i:[3,10,75],k:[3,12,60],f:[3,15,60]},
    lift:{m:[4,5,180],c:[3,8,120],i:[3,10,75],k:[3,12,60],f:[3,15,60]},
    size:{m:[4,8,120],c:[3,10,90],i:[3,12,60],k:[3,15,60],f:[3,15,60]},
    muscle:{m:[4,8,120],c:[3,10,90],i:[3,12,60],k:[3,15,60],f:[3,15,60]},
    lean:{m:[3,10,75],c:[3,12,60],i:[3,15,45],k:[3,15,45],f:[4,15,45]},
  }[goal][kind];
  let [sets,reps,rest]=S;
  if(exp==='new')sets=Math.max(2,sets-1);
  if(exp==='adv'&&(kind==='m'||kind==='c'))sets+=1;
  if(exp==='new'&&kind==='m'&&goal==='strength')reps=6;
  return [sets,reps,rest];
}
function buildSets(exId,sets,reps,opts={}){
  const ex=EXMAP[exId];const t=ex?ex.type:'w';const out=[];
  const warm=opts.warmups||0;
  for(let i=0;i<warm;i++)out.push({kind:'w',w:opts.w?planWeight(opts.wUser*(i===0?0.5:0.7)):null,r:i===0?8:5,t:null,d:null});
  for(let i=0;i<sets;i++){
    if(t==='t')out.push({kind:'n',w:null,r:null,t:opts.secs||45,d:null});
    else out.push({kind:'n',w:opts.w??null,r:reps,t:null,d:null});
  }
  return out;
}
function generatePlan(a){
  const equip=a.equip||'gym',exp=a.exp||'mid',days=Math.min(6,Math.max(2,+a.days||3));
  const per={30:4,45:5,60:6,75:7}[a.time]||5;
  const goalKey=a.goal==='lift'?'lift':a.goal==='muscle'?'muscle':a.goal;
  let split=PLAN_SPLITS[days].map(k=>Object.assign({key:k},PLAN_DAYS[k],{slots:PLAN_DAYS[k].slots.slice()}));
  // Pull-ups need a bar. Beginners in a gym and anyone without a gym get a pulldown or row instead,
  // unless pull-ups are the lift they asked to improve.
  const swapPull=!(a.goal==='lift'&&a.lift==='pullup')&&(equip!=='gym'||exp==='new');
  if(swapPull)split.forEach(d=>{d.slots=d.slots.map(s=>s==='verticalPull'?'latPulldown':s)});
  const focusDays=types=>{const idx=[];types.forEach(t=>split.forEach((d,i)=>{if(d.type===t&&!idx.includes(i))idx.push(i)}));return idx};
  const notes=[];let title='',weekly=[],liftInfo=null;
  if(a.goal==='lift'){
    const L=PLAN_LIFTS[a.lift]||PLAN_LIFTS.bench;
    const fd=focusDays(L.days).slice(0,2);if(fd.length<2&&split.length>1)split.forEach((d,i)=>{if(fd.length<2&&!fd.includes(i))fd.push(i)});
    fd.forEach((di,n)=>{const d=split[di];d.slots=d.slots.filter(s=>s!==L.slot&&s!==L.variant);
      if(n===0){d.slots.unshift(L.slot);d.heavy=true;d.slots.splice(4,0,L.helpers[0])}
      else{d.slots.unshift(L.slot);d.slots.splice(1,0,L.variant);d.volume=true;d.slots.splice(3,0,L.helpers[1])}
      d.slots=[...new Set(d.slots)];d.name+=n===0?` · heavy ${L.name.toLowerCase()}`:` · ${L.name.toLowerCase()} volume`;});
    // One more helper on a third day if there is one
    const other=split.findIndex((d,i)=>!fd.includes(i)&&L.days.includes(d.type));if(other>=0){split[other].slots.splice(2,0,L.helpers[2]);split[other].slots=[...new Set(split[other].slots)]}
    title=`${L.name} focus`;
    const unit=u();const best=+a.bestW>0&&+a.bestR>0?{w:+a.bestW,r:Math.min(12,+a.bestR)}:null;
    if(a.lift==='pullup'){
      const r=best?Math.max(1,+a.bestR):(+a.bestR>0?+a.bestR:null);
      liftInfo={name:L.name,reps:r};
      const base=r?Math.max(2,Math.round(r*0.6)):3;
      weekly=[`Week 1: heavy day 4×${base}, volume day 4×${Math.max(1,base-1)}`,
        `Week 2: heavy day 4×${base+1}, add one set on volume day`,
        `Week 3: heavy day 5×${base+1}, add weight (a vest or dumbbell between your feet) if all sets felt easy`,
        `Week 4: lighter week. 3×${Math.max(1,base-1)}, then test your max reps at the end of the week`];
      if(!r)notes.push('Can’t do a full pull-up yet? Use the assisted machine or a band, or do slow 5-second lowering reps (negatives).');
    }else if(best){
      const e1=best.w*(1+best.r/30);liftInfo={name:L.name,e1rm:e1,unit};
      const pct=p=>{const step=unit==='lb'?5:2.5;return Math.round(e1*p/step)*step};
      weekly=[`Week 1: heavy ${pct(.80)} ${unit} × 5 for 3 sets · volume ${pct(.70)} ${unit} × 8 for 4 sets`,
        `Week 2: heavy ${pct(.825)} ${unit} × 4 for 4 sets · volume ${pct(.72)} ${unit} × 8 for 4 sets`,
        `Week 3: heavy ${pct(.87)} ${unit} × 3 for 4 sets · volume ${pct(.75)} ${unit} × 6 for 4 sets`,
        `Week 4: lighter week at ${pct(.65)} ${unit} × 5 for 3 sets, then test a new best set of ${best.r} at the end of the week`];
      notes.push(`Your estimated max is about ${Math.round(e1)} ${unit}, based on ${best.w} ${unit} × ${best.r}. Your week 1 weights are already filled in.`);
    }else{
      weekly=['Week 1: heavy day 3 sets of 5 with a weight you could lift 7 times · volume day 4×8 with a weight you could lift 11 times',
        'Week 2: add 5 lb (2.5 kg) to both days if every rep looked clean',
        'Week 3: heavy day 4 sets of 3, a little heavier again',
        'Week 4: lighter week, about 3×5 at an easy weight, then test a new best set'];
      notes.push('Add your best recent set next time and the app will fill in your weights for you.');
    }
  }else if(a.goal==='muscle'){
    const M=PLAN_MUSCLES[a.muscle]||PLAN_MUSCLES.chest;title=`${M.name} focus`;
    const fd=focusDays(M.days);let k=0;
    split.forEach((d,i)=>{
      const extra=fd.slice(0,2).includes(i)?2:fd.includes(i)?1:0;
      const add=[];for(let n=0;n<extra;n++){add.push(M.slots[k%M.slots.length]);k++}
      if(add.length){
        const comp=add.filter(x=>SLOT_KIND[x]==='m'||SLOT_KIND[x]==='c'),iso=add.filter(x=>!comp.includes(x));
        const rest=d.slots.slice(1),firstIso=rest.findIndex(x=>KIND_ORDER[SLOT_KIND[x]]>=2);
        const at=firstIso<0?rest.length:firstIso;
        d.slots=[...new Set([d.slots[0],...comp,...rest.slice(0,at),...iso,...rest.slice(at)])];d.focus=true}
    });
    weekly=['Week 1: leave 2–3 reps in the tank on every set','Week 2: same exercises, add a rep or a little weight where you can','Week 3: push your focus exercises close to failure on the last set','Week 4: lighter week. Cut every exercise to 2 sets, then start the plan again a little heavier'];
  }else{
    title={size:'Build muscle',strength:'Get stronger',lean:'Lean and fit'}[a.goal]||'My plan';
    weekly=a.goal==='strength'?['Week 1: pick weights you could lift 2 more times than the target','Week 2: add 5 lb (2.5 kg) to main lifts when every rep was clean','Week 3: add weight again on main lifts; accessories get one more rep','Week 4: lighter week at about 80% of week 3, then repeat the plan heavier']
      :a.goal==='lean'?['Week 1: move quickly between exercises, keep rest short','Week 2: same weights, try to cut 15 seconds of rest','Week 3: add a little weight or a few reps everywhere','Week 4: lighter week, then repeat the plan. Walk 7,000+ steps on rest days']
      :['Week 1: leave 2–3 reps in the tank on every set','Week 2: add a rep or a little weight to each exercise','Week 3: take the last set of each exercise close to failure','Week 4: lighter week. Cut every exercise to 2 sets, then repeat the plan heavier'];
    if(a.goal==='lean')split.forEach(d=>d.slots.push('finisher'));
  }
  // Fill each day with real exercises, avoiding repeats inside a day and spreading variety across days.
  const usedAll=new Set();const barOK=a.goal==='lift'&&a.lift==='pullup';
  const out=split.map((d,di)=>{
    const avoid=new Set();const ex=[];
    const cap=per+((d.heavy||d.volume||d.focus)?1:0)+(a.goal==='lean'?1:0);
    const ordered=d.slots.slice();
    if(a.goal==='lean'){const f=ordered.indexOf('finisher');if(f>=0){ordered.splice(f,1)}}
    for(const s of ordered){
      if(ex.length>=cap-(a.goal==='lean'?1:0))break;
      let id=planPick(s,equip,avoid,barOK);
      if(!id)continue;
      // Prefer a different variation if this exact exercise is already in another day and an alternative exists.
      if(usedAll.has(id)&&SLOT_KIND[s]!=='m'&&!(a.goal==='lift'&&PLAN_LIFTS[a.lift]?.slot===s)){const alt=planPick(s,equip,new Set([...avoid,id]),barOK);if(alt&&!usedAll.has(alt))id=alt}
      avoid.add(id);ex.push({slot:s,id});
    }
    // Home plans can run short on some days; top up with core and leg work so every day is a real workout.
    for(const s of ['backExt','glute2','core2','obliques','abs','singleLeg','calf']){if(ex.length>=Math.min(4,cap-(a.goal==='lean'?1:0)))break;const id=planPick(s,equip,avoid,barOK);if(id){avoid.add(id);ex.push({slot:s,id})}}
    if(a.goal==='lean'){const id=planPick('finisher',equip,avoid,barOK);if(id)ex.push({slot:'finisher',id})}
    ex.forEach(e=>usedAll.add(e.id));
    const L=a.goal==='lift'?PLAN_LIFTS[a.lift]||PLAN_LIFTS.bench:null;
    const M=a.goal==='muscle'?PLAN_MUSCLES[a.muscle]||PLAN_MUSCLES.chest:null;
    const exercises=ex.map(({slot,id})=>{
      const kind=SLOT_KIND[slot]||'c';let [sets,reps,rest]=scheme(goalKey==='lift'||goalKey==='muscle'?(goalKey==='lift'?'lift':'size'):goalKey,kind,exp);
      let opts={},note='';
      if(M&&M.slots.includes(slot)&&kind!=='m')sets=Math.max(sets,4);
      if(L&&slot===L.slot){
        if(d.heavy){sets=exp==='new'?3:4;reps=a.lift==='pullup'?(liftInfo&&liftInfo.reps?Math.max(2,Math.round(liftInfo.reps*.6)):3):5;rest=180;opts.warmups=a.lift==='pullup'?0:2;note='Heavy day. Leave 1–2 reps in the tank.'}
        else{sets=4;reps=a.lift==='pullup'?(liftInfo&&liftInfo.reps?Math.max(1,Math.round(liftInfo.reps*.5)):3):8;rest=150;opts.warmups=a.lift==='pullup'?0:1;note='Volume day. Smooth, fast reps.'}
        if(liftInfo&&liftInfo.e1rm){const w=liftInfo.e1rm*(d.heavy?.80:.70);opts.w=planWeight(w);opts.wUser=w;if(d.heavy)sets=3}
      }
      if(L&&slot===L.variant){sets=3;reps=6;rest=120}
      if(EXMAP[id]&&EXMAP[id].type==='t')opts.secs=kind==='k'?(exp==='new'?30:45):45;
      // Low reps make sense with weight on the bar, not for push-ups or air squats.
      const HARD_BW=['pull-up','chin-up','pistol-squat','archer-push-up','handstand-hold','pike-push-up','nordic-hamstring-curl'];
      if(EXMAP[id]&&EXMAP[id].equip==='Bodyweight'&&EXMAP[id].type!=='t'&&reps<10&&!HARD_BW.includes(id)&&!(L&&slot===L.slot))reps=Math.max(reps,id==='push-up'||id==='bodyweight-squat'?12:10);
      if(slot==='finisher'){sets=3;reps=equip==='bw'?10:15;rest=45;note='Finisher. Go hard, short rest.'}
      return {exId:id,rest,note,sets:buildSets(id,sets,reps,opts)};
    });
    return {name:`Day ${di+1} · ${d.name}`,exercises};
  });
  const goalName=a.goal==='lift'?`Get stronger at ${(PLAN_LIFTS[a.lift]||PLAN_LIFTS.bench).name.toLowerCase()}`:a.goal==='muscle'?`Build your ${(PLAN_MUSCLES[a.muscle]||PLAN_MUSCLES.chest).name.toLowerCase()}`:PLAN_GOALS[a.goal];
  notes.push('Warm up for 5 minutes before you start. If a set hurts (not just burns), stop and swap the exercise.');
  if(equip!=='gym')notes.push(equip==='db'?'Built for dumbbells and a bench. Swap in anything else you have.':'Built for no equipment. For inverted rows, use a sturdy table or a low bar. A pull-up bar or bands open up more options.');
  return {id:'plan-'+newId(),title,goal:goalName,answers:a,created:Date.now(),weeks:4,days:out,weekly,notes,minutes:+a.time||45,e1rm:liftInfo&&liftInfo.e1rm?liftInfo.e1rm:null};
}

const PLAN_DEF={goal:'lift',lift:'bench',muscle:'chest',exp:'mid',days:4,time:60,equip:'gym',bestW:'',bestR:''};

function planNextIndex(p){
  if(!p)return 0;const names=p.days.map(d=>`${p.title} · ${d.name}`);
  const last=ST.workouts.find(w=>names.includes(w.name)&&w.start>=p.created);
  return last?(names.indexOf(last.name)+1)%names.length:0;
}
function planWeek(p){return Math.min(p.weeks,Math.floor((Date.now()-p.created)/(7*864e5))+1)}

/* ---------- simple line chart with tap/hover readout ---------- */
function lineChart(pts,fmt,label){
  if(pts.length<2)return `<p class="muted" style="font-size:14px">Log this a couple more times to see your trend.</p>`;
  const W=340,H=170,L=10,R=12,T=16,B=24;
  const vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),pad=(mx-mn)*.12||1,lo=mn-pad,hi=mx+pad;
  const t0=pts[0].t,t1=pts[pts.length-1].t,ts=t1-t0||1;
  const X=t=>L+(t-t0)/ts*(W-L-R),Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  const d=pts.map((p,k)=>`${k?'L':'M'}${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
  const grid=[0,.5,1].map(f=>{const v=lo+(hi-lo)*f;return `<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`}).join('');
  const last=pts[pts.length-1];
  const data=esc(JSON.stringify(pts.map(p=>[Math.round(X(p.t)),Math.round(Y(p.v)),fmt(p.v),fmtDate(p.t)])));
  return `<div class="lc" data-pts="${data}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
    ${grid}
    <path d="${d}" fill="none" stroke="var(--mind)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.length<=24?pts.map(p=>`<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4" fill="var(--mind)" stroke="var(--surface)" stroke-width="2"/>`).join(''):`<circle cx="${X(last.t).toFixed(1)}" cy="${Y(last.v).toFixed(1)}" r="4" fill="var(--mind)" stroke="var(--surface)" stroke-width="2"/>`}
    <text x="${L}" y="${H-6}" font-size="11" font-family="JetBrains Mono,monospace" fill="var(--muted)">${fmtDate(t0)}</text>
    <text x="${W-R}" y="${H-6}" text-anchor="end" font-size="11" font-family="JetBrains Mono,monospace" fill="var(--muted)">${fmtDate(t1)}</text>
    <line class="lc-x" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/>
    <circle class="lc-dot" r="6" fill="var(--mind)" stroke="var(--fg)" stroke-width="2" visibility="hidden"/>
    <rect class="lc-hit" x="0" y="0" width="${W}" height="${H}" fill="transparent"/></svg>
    <div class="lc-tip" hidden></div></div>`;
}
document.addEventListener('pointermove',lcMove,{passive:true});
document.addEventListener('pointerdown',lcMove,{passive:true});
function lcMove(e){
  const hit=e.target.closest&&e.target.closest('.lc-hit');
  document.querySelectorAll('.lc').forEach(c=>{if(!hit||!c.contains(hit)){const tip=c.querySelector('.lc-tip');if(tip&&!tip.hidden){tip.hidden=true;c.querySelector('.lc-x').setAttribute('visibility','hidden');c.querySelector('.lc-dot').setAttribute('visibility','hidden')}}});
  if(!hit)return;
  const c=hit.closest('.lc'),svg=c.querySelector('svg'),pts=JSON.parse(c.dataset.pts);
  const r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal,x=(e.clientX-r.left)/r.width*vb.width;
  let best=pts[0];pts.forEach(p=>{if(Math.abs(p[0]-x)<Math.abs(best[0]-x))best=p});
  const lx=c.querySelector('.lc-x'),dot=c.querySelector('.lc-dot'),tip=c.querySelector('.lc-tip');
  lx.setAttribute('x1',best[0]);lx.setAttribute('x2',best[0]);lx.setAttribute('visibility','visible');
  dot.setAttribute('cx',best[0]);dot.setAttribute('cy',best[1]);dot.setAttribute('visibility','visible');
  tip.innerHTML=`<b>${esc(best[2])}</b><span>${esc(best[3])}</span>`;tip.hidden=false;
  const px=best[0]/vb.width*r.width;tip.style.left=Math.max(8,Math.min(r.width-118,px-55))+'px';
}

function parsePR(str){
  const m=String(str).match(/^(.*?): (best estimated 1RM|heaviest weight|most reps|longest) (.+)$/);
  if(!m)return {ex:String(str),label:'Personal record',value:''};
  const lab={'best estimated 1RM':'Estimated 1-rep max','heaviest weight':'Heaviest weight','most reps':'Most reps','longest':'Longest hold'}[m[2]];
  // Estimated maxes read better as whole numbers on a share card.
  const val=m[2]==='best estimated 1RM'?m[3].replace(/^([\d.]+)/,n=>String(Math.round(+n))):m[3];
  return {ex:m[1],label:lab,value:m[2]==='most reps'?`${val} reps`:val};
}
function recentPRs(n=12){
  const out=[];ST.workouts.forEach(w=>(w.prs||[]).forEach(p=>out.push(Object.assign(parsePR(p),{t:w.start,wid:w.id}))));
  return out.slice(0,n);
}

/* ---------- progress and streaks ---------- */
const weekKey=t=>{const x=new Date(t);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x.getTime()};
function streaks(){
  const weeks=new Set(ST.workouts.map(w=>weekKey(w.start)));
  const wk=7*864e5;let cur=0,k=weekKey(Date.now());
  if(!weeks.has(k))k-=wk; // this week isn't over yet
  while(weeks.has(k)){cur++;k-=wk}
  const sorted=[...weeks].sort((a,b)=>a-b);let best=0,run=0,prev=null;
  sorted.forEach(w=>{run=prev!=null&&Math.round((w-prev)/wk)===1?run+1:1;best=Math.max(best,run);prev=w});
  const m=new Date();m.setDate(1);m.setHours(0,0,0,0);
  return {cur,best,month:ST.workouts.filter(w=>w.start>=m.getTime()).length,total:ST.workouts.length};
}

function topLifts(){

  return Object.entries(c).filter(([,n])=>n>=1).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([id])=>id);
}

/* ---------- calculators ---------- */
function plateMath(target,bar){
  const plates=u()==='lb'?[45,35,25,10,5,2.5]:[25,20,15,10,5,2.5,1.25];
  let side=(target-bar)/2;const out=[];if(side<0)return {out,left:target-bar};
  for(const p of plates){while(side>=p-1e-9){out.push(p);side-=p}}
  return {out,left:Math.round(side*2*100)/100};
}
function openTools(tab='plates',prefill){
  const lb=u()==='lb';const st={tab,w:prefill||'',bar:lb?45:20,reps:''};

  const paint=()=>{

      const {out:ps,left}=plateMath(w,st.bar);

        <b style="font-size:18px">${ps.length?ps.join(' + ')+' '+u():'Just the bar'}</b>
        ${left?`<p class="muted" style="font-size:13px;margin:0">${left} ${u()} can’t be made with standard plates. Closest: ${w-left} ${u()}.</p>`:''}</div>`;

    }
  };
  seg.onclick=e=>{const b=e.target.closest('[data-t]');if(b){st.tab=b.dataset.t;paint()}};
  paint();
}

/* ---------- self-updating plans ---------- */
const HEAVY_W=[.80,.825,.87,.65],HEAVY_R=[5,4,3,5],HEAVY_N=[3,4,4,3],VOL_W=[.70,.72,.75,.65],VOL_R=[8,8,6,5],VOL_N=[4,4,4,3];
function planAdjust(p,i){
  const d=p.days[i];const wk=planWeek(p),deload=wk>=p.weeks;const notes=[];
  const L=p.answers&&p.answers.goal==='lift'?PLAN_LIFTS[p.answers.lift]:null;
  const exs=clone(d.exercises).map((x,k)=>{
    const ex=EXMAP[x.exId];if(!ex)return x;
    const isMain=L&&k===0&&/heavy|volume/.test(d.name)&&(PLAN_SLOTS[L.slot]||[]).includes(x.exId);
    if(isMain&&p.e1rm&&ex.type==='w'){
      const heavy=/heavy/.test(d.name),w=wk-1;
      const pct=(heavy?HEAVY_W:VOL_W)[w],reps=(heavy?HEAVY_R:VOL_R)[w],n=(heavy?HEAVY_N:VOL_N)[w];
      const wt=planWeight(p.e1rm*pct);
      x.sets=[{kind:'w',w:planWeight(p.e1rm*pct*.5),r:8,t:null,d:null},{kind:'w',w:planWeight(p.e1rm*pct*.75),r:4,t:null,d:null}]
        .concat(Array.from({length:n},()=>({kind:'n',w:wt,r:reps,t:null,d:null})));
      x.note=(heavy?`Week ${wk}: ${n} × ${reps} at ${Math.round(pct*100)}% of your max.`:`Week ${wk}: ${n} × ${reps}, smooth and fast.`)+(deload?' Lighter week, let your body recover.':'');
      return x;
    }
    const work=x.sets.filter(s=>s.kind!=='w');
    const last=(lastSets[x.exId]||[]).filter(s=>s.kind!=='w');
    if(last.length&&work.length){
      const target=work[0].r||0;
      const hit=target&&last.every(s=>(s.r||0)>=target);
      if(ex.type==='w'&&last.some(s=>s.w)){
        const top=Math.max(...last.map(s=>s.w||0));
        const next=hit?top+inW(u()==='lb'?5:2.5):top;
        const wUser=u()==='lb'?next*KG_LB:next;
        work.forEach(s=>s.w=inW(Math.max(plateStep(),roundPlate(wUser))));
        if(hit)notes.push(EXMAP[x.exId].name.replace(/ \(.*\)/,''));
      }else if((ex.type==='b'||ex.type==='a')&&hit){work.forEach(s=>s.r=Math.min(target+5,Math.max(...last.map(s=>s.r||0))+1))}
    }
    if(deload&&!isMain){const ws=x.sets.filter(s=>s.kind!=='w');if(ws.length>2)x.sets.splice(x.sets.lastIndexOf(ws[ws.length-1]),1);x.sets.forEach(s=>{if(s.w)s.w=inW(Math.max(plateStep(),roundPlate((u()==='lb'?s.w*KG_LB:s.w)*.9)))})}
    return x;
  });
  return {exercises:exs,raised:notes};
}
function planDone(p){return p&&Date.now()-p.created>p.weeks*7*864e5}
function nextBlockAnswers(p){
  const a=Object.assign({},p.answers);
  if(a.goal==='lift'&&a.lift!=='pullup'){
    const L=PLAN_LIFTS[a.lift],ids=PLAN_SLOTS[L.slot]||[];let best=null;
    ST.workouts.filter(w=>w.start>=p.created).forEach(w=>w.exercises.filter(e=>ids.includes(e.exId)).forEach(e=>e.sets.forEach(s=>{if(s.kind!=='w'&&s.w&&s.r&&s.r<=10&&(!best||e1rm(s)>e1rm(best)))best=s})));
    if(best){a.bestW=String(roundPlate(u()==='lb'?best.w*KG_LB:best.w));a.bestR=String(best.r)}
  }
  return a;
}

const PUSH={on:false,timer:null,end:0};

const isStandalone=()=>window.matchMedia&&matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const pushSupported=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
// Wait for the background service, but never forever: register it if needed and give up after a few seconds.
async function swReady(){
  const t=ms=>new Promise(r=>setTimeout(()=>r(null),ms));
  let reg=await Promise.race([navigator.serviceWorker.ready,t(2500)]);
  if(reg)return reg;
  try{reg=await navigator.serviceWorker.getRegistration()||await navigator.serviceWorker.register('sw.js')}catch(e){reg=null}
  if(reg&&reg.active)return reg;
  reg=await Promise.race([navigator.serviceWorker.ready,t(6000)]);
  return reg||null;
}
async function pushState(){
  if(!pushSupported())return 'unsupported';
  if(Notification.permission==='denied')return 'denied';
  const reg=await swReady();if(!reg)return 'nosw';
  try{const sub=await reg.pushManager.getSubscription();return sub&&Notification.permission==='granted'?'on':'off'}catch(e){return 'off'}
}
const b64ToBytes=s=>{const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))};
async function enablePush(){
  const perm=await Notification.requestPermission();
  if(perm!=='granted')throw new Error(perm==='denied'?'Notifications are blocked. Turn them on in your phone’s Settings for Brainweight.':'Notifications weren’t turned on.');
  const key=await API.pushKey();const reg=await swReady();
  if(!reg)throw new Error('Notifications couldn’t start. Close Brainweight fully, reopen it from your Home Screen, and try again.');
  let sub=await reg.pushManager.getSubscription();
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToBytes(key)});
  await API.savePushSub(sub.toJSON());PUSH.on=true;
}
async function disablePush(){
  try{const reg=await swReady();const sub=reg&&await reg.pushManager.getSubscription();if(sub){await API.removePushSub(sub.endpoint).catch(()=>{});await sub.unsubscribe()}}catch(e){}
  PUSH.on=false;
}

window.BWPushHook=(name,...a)=>{

    },400);

/* ================= daily word ================= */
// One five-letter word a day, the same for everyone. Six guesses.
// Puzzle #1 is November 10, 2026 (local date), so everyone on the same calendar day gets the same word.
const DAILY_START=Date.UTC(2026,10,10);
function dailyNo(d=new Date()){return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-DAILY_START)/864e5)+1}
function dailyAnswer(n){const c=DAILY_ANSWERS.length/5,i=(((n-1)%c)+c)%c;return DAILY_ANSWERS.substr(i*5,5)}
function dailyValid(w){let lo=0,hi=DAILY_VALID.length/5-1;while(lo<=hi){const m=(lo+hi)>>1,x=DAILY_VALID.substr(m*5,5);if(x===w)return true;x<w?lo=m+1:hi=m-1}return w===dailyAnswer(dailyNo())}
// g = right spot, y = in the word, x = not in the word. Handles repeated letters the standard way.
function dailyScore(guess,ans){
  const r=Array(5).fill('x'),left={};
  for(let i=0;i<5;i++){if(guess[i]===ans[i])r[i]='g';else left[ans[i]]=(left[ans[i]]||0)+1}
  for(let i=0;i<5;i++){if(r[i]!=='g'&&left[guess[i]]){r[i]='y';left[guess[i]]--}}
  return r.join('');
}
function dailyState(){const n=dailyNo();let s=LS.get('daily_state',null);if(!s||s.n!==n)s={n,guesses:[],done:false,won:false};return s}
function dailyStats(){return Object.assign({played:0,wins:0,streak:0,max:0,dist:[0,0,0,0,0,0],lastWin:0,lastPlayed:0},LS.get('daily_stats',{}))}
function dailyStreakNow(){const s=dailyStats(),n=dailyNo();return s.lastWin>=n-1?s.streak:0}
function dailyFinish(st){
  const s=dailyStats();if(s.lastPlayed>=st.n)return s;
  s.played++;s.lastPlayed=st.n;
  if(st.won){s.wins++;s.dist[st.guesses.length-1]++;s.streak=s.lastWin===st.n-1?s.streak+1:1;s.lastWin=st.n;s.max=Math.max(s.max,s.streak)}
  else s.streak=0;
  LS.set('daily_stats',s);
  const pattern=st.guesses.map(g=>dailyScore(g,dailyAnswer(st.n))).join(',');
  if(API.dailySubmit)API.dailySubmit(st.n,st.won?st.guesses.length:0,pattern).catch(()=>{});
  return s;
}
const DAILY_EMOJI={g:'🟩',y:'🟨',x:'⬛'};
function dailyShareText(st){
  const ans=dailyAnswer(st.n);
  return `Brainweight daily #${st.n} ${st.won?st.guesses.length:'X'}/6${dailyStreakNow()>1?` · 🔥${dailyStreakNow()}`:''}\n\n${st.guesses.map(g=>[...dailyScore(g,ans)].map(c=>DAILY_EMOJI[c]).join('')).join('\n')}\n\nbrainweight.fit`;
}
function dailyUntil(){const t=new Date();t.setHours(24,0,0,0);const s=Math.max(0,Math.floor((t-Date.now())/1000));return `${Math.floor(s/3600)}h ${String(Math.floor(s%3600/60)).padStart(2,'0')}m`}
function dailyCardHTML(){
  const st=dailyState(),k=dailyStreakNow(),ans=dailyAnswer(st.n);
  const rows=st.guesses.length?st.guesses.slice(-1).map(g=>dailyScore(g,ans)):['xxxxx'];
  const mini=[...rows[0]].map((c,i)=>`<i class="dt-${st.guesses.length?c:'e'}">${st.guesses.length?'':'DAILY'[i]}</i>`).join('');
  const status=st.done?(st.won?`Solved in ${st.guesses.length} · next word in ${dailyUntil()}`:`Missed today · next word in ${dailyUntil()}`)
